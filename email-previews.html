<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Previsualizador de Correos - Dale! Te Pido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090707;
      --panel-bg: #141111;
      --card-bg: #1c1818;
      --border-color: rgba(255, 255, 255, 0.08);
      --red-primary: #D60000;
      --text-main: #FFFFFF;
      --text-muted: #A1A1AA;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { height: 60px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 32px; height: 32px; background: var(--red-primary); border-radius: 8px; display: grid; place-items: center; font-weight: 900; font-size: 14px; color: #fff; }
    .brand-title { font-weight: 800; font-size: 16px; letter-spacing: -0.5px; }

    .main-layout { display: flex; flex: 1; height: calc(100vh - 60px); overflow: hidden; }
    
    .sidebar { width: 320px; background: var(--panel-bg); border-right: 1px solid var(--border-color); padding: 20px 16px; overflow-y: auto; flex-shrink: 0; }
    .section-label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 12px; padding-left: 8px; }

    .nav-item { padding: 14px 16px; border-radius: 12px; background: transparent; border: 1px solid transparent; color: var(--text-muted); cursor: pointer; transition: all 0.2s ease; margin-bottom: 8px; text-align: left; display: flex; flex-direction: column; gap: 4px; width: 100%; }
    .nav-item:hover { background: var(--card-bg); color: var(--text-main); }
    .nav-item.active { background: rgba(214, 0, 0, 0.12); border-color: var(--red-primary); color: var(--text-main); }
    .nav-item-title { font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: space-between; }
    .nav-item-sub { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .badge-num { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 50px; font-size: 11px; }

    .content-area { flex: 1; display: flex; flex-direction: column; background: #000; overflow: hidden; }
    .subject-bar { padding: 16px 24px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; font-size: 14px; flex-shrink: 0; }
    .subject-tag { background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .subject-text { font-weight: 700; color: #fff; }

    .preview-container { flex: 1; display: grid; place-items: center; padding: 20px; overflow-y: auto; background: #050404; }
    iframe { width: 100%; max-width: 650px; height: 100%; min-height: 680px; border: none; border-radius: 16px; background: #0d0b0b; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }

    @media (max-width: 768px) {
      .main-layout { flex-direction: column; }
      .sidebar { width: 100%; height: 160px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-logo">DTP</div>
      <div class="brand-title">Dale! Te Pido · Muestrario de Correos</div>
    </div>
    <div style="font-size: 12px; color: var(--text-muted);">
      5 Plantillas Transaccionales
    </div>
  </header>

  <div class="main-layout">
    <div class="sidebar">
      <div class="section-label">Seleccionar Plantilla</div>
      
      <button class="nav-item active" onclick="loadEmail(1)">
        <div class="nav-item-title">
          <span>🚀 1. Bienvenida / Activación</span>
          <span class="badge-num">Email #1</span>
        </div>
        <div class="nav-item-sub">Registro de tienda y 15 días gratis</div>
      </button>

      <button class="nav-item" onclick="loadEmail(2)">
        <div class="nav-item-title">
          <span>🔑 2. Restablecer Clave</span>
          <span class="badge-num">Email #2</span>
        </div>
        <div class="nav-item-sub">Recuperación de contraseña segura</div>
      </button>

      <button class="nav-item" onclick="loadEmail(3)">
        <div class="nav-item-title">
          <span>⏳ 3. Recordatorio (7 días)</span>
          <span class="badge-num">Email #3</span>
        </div>
        <div class="nav-item-sub">Mitad de la prueba (7 días restantes)</div>
      </button>

      <button class="nav-item" onclick="loadEmail(4)">
        <div class="nav-item-title">
          <span>⚠️ 4. Recordatorio (12 días)</span>
          <span class="badge-num">Email #4</span>
        </div>
        <div class="nav-item-sub">Alerta de vencimiento (3 días restantes)</div>
      </button>

      <button class="nav-item" onclick="loadEmail(5)">
        <div class="nav-item-title">
          <span>🔴 5. Fin de Prueba</span>
          <span class="badge-num">Email #5</span>
        </div>
        <div class="nav-item-sub">Oferta de conversión y planes</div>
      </button>
    </div>

    <div class="content-area">
      <div class="subject-bar">
        <span class="subject-tag">Asunto</span>
        <span class="subject-text" id="subject-display">Cargando...</span>
      </div>
      <div class="preview-container">
        <iframe id="email-frame"></iframe>
      </div>
    </div>
  </div>

  <script>
    async function loadEmail(num) {
      document.querySelectorAll('.nav-item').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === num);
      });

      document.getElementById('subject-display').textContent = 'Cargando plantilla...';

      try {
        const res = await fetch(`/api/email-templates?template=${num}&format=json`);
        const data = await res.json();
        
        if (data.success) {
          document.getElementById('subject-display').textContent = data.subject;
          const frame = document.getElementById('email-frame');
          const doc = frame.contentDocument || frame.contentWindow.document;
          doc.open();
          doc.write(data.html);
          doc.close();
        } else {
          document.getElementById('subject-display').textContent = 'Error al cargar la plantilla';
        }
      } catch (err) {
        console.error('Error al cargar plantilla:', err);
        document.getElementById('subject-display').textContent = 'Error de conexión';
      }
    }

    // Load initial email
    window.addEventListener('DOMContentLoaded', () => loadEmail(1));
  </script>
</body>
</html>

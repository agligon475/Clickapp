<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Envío a Prospectos — Super Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <script>
    (function() {
      const token = sessionStorage.getItem('super_admin_master_key');
      if (!token || token.trim().length === 0) {
        window.location.replace('super-admin-login.html');
      }
    })();
  </script>

  <style>
    :root {
      --bg-body: #F1F5F9;
      --bg-card: #FFFFFF;
      --bg-input: #F8FAFC;
      --border-color: #CBD5E1;
      --text-main: #0F172A;
      --text-muted: #334155;
      --blue-primary: #2563EB;
      --blue-hover: #1D4ED8;
      --font-title: 'Josefin Sans', sans-serif;
      --font-body: 'Poppins', sans-serif;
    }

    body.dark-mode {
      --bg-body: #0A0A0C;
      --bg-card: #141416;
      --bg-input: #1C1C1E;
      --border-color: #27272A;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3 {
      font-family: var(--font-title);
    }

    header {
      background: var(--bg-card);
      border-bottom: 1.5px solid var(--border-color);
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-wrap img {
      height: 32px;
      filter: brightness(0);
    }
    body.dark-mode .brand-wrap img {
      filter: brightness(0) invert(1);
    }

    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1.5px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--bg-input);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--blue-primary);
      color: #FFF;
      border-color: var(--blue-primary);
    }
    .btn-primary:hover {
      background: var(--blue-hover);
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 28px auto;
      padding: 0 20px;
    }

    .prospect-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .prospect-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .ctrl-input, select, textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      padding: 12px 14px;
      font-family: var(--font-body);
      font-size: 14px;
      outline: none;
    }

    .preview-box {
      background: var(--bg-input);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      height: 520px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #FFF;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <img src="/img-default/daletepido-logo-white-hq.png" alt="Logo" />
      <h2>Prospección de Clientes</h2>
    </div>
    <div style="display: flex; gap: 10px;">
      <a href="super-admin-secret-dashboard.html" class="btn"><i class="bi bi-arrow-left"></i> Volver al Dashboard</a>
    </div>
  </header>

  <main>
    <div class="prospect-grid">
      <!-- FORM -->
      <div class="card">
        <h3 style="font-size: 20px; margin-bottom: 16px; color: var(--blue-primary);"><i class="bi bi-send-fill"></i> Datos del Prospecto</h3>
        
        <div class="form-group">
          <label>* Email Destinatario</label>
          <input type="email" id="prospect-email" class="ctrl-input" placeholder="" oninput="updatePreview()" />
        </div>

        <div class="form-group">
          <label>Nombre del Comercio / Contacto</label>
          <input type="text" id="prospect-name" class="ctrl-input" placeholder="" oninput="updatePreview()" />
        </div>

        <div class="form-group">
          <label>Plantilla de Venta / Propuesta</label>
          <select id="prospect-preset" onchange="loadPreset()">
            <option value="gastronomia">🍔 Propuesta Gastronomía / Restaurante</option>
            <option value="indumentaria">👗 Propuesta Moda & Indumentaria</option>
            <option value="ferreteria">🛠️ Propuesta Ferretería & Herramientas</option>
            <option value="general">🚀 Propuesta Comercio General / Catálogo</option>
          </select>
        </div>

        <div class="form-group">
          <label>Asunto Personalizado</label>
          <input type="text" id="prospect-subject" class="ctrl-input" placeholder="" oninput="updatePreview()" />
        </div>

        <div class="form-group">
          <label>Mensaje Personalizado</label>
          <textarea id="prospect-body" style="height: 100px; resize: vertical;" oninput="updatePreview()"></textarea>
        </div>

        <div id="status-msg" style="display:none; font-size: 13px; margin-bottom: 12px;"></div>

        <button class="btn btn-primary" style="width: 100%; justify-content: center; height: 46px;" onclick="sendEmail()">
          <i class="bi bi-send-fill"></i> Enviar Correo al Prospecto
        </button>
      </div>

      <!-- LIVE PREVIEW -->
      <div class="card">
        <h3 style="font-size: 20px; margin-bottom: 16px;"><i class="bi bi-eye-fill"></i> Vista Previa en Tiempo Real</h3>
        <div class="preview-box">
          <iframe id="preview-iframe"></iframe>
        </div>
      </div>
    </div>
  </main>

  <script>
    const masterToken = sessionStorage.getItem('super_admin_master_key') || '';

    const presets = {
      gastronomia: {
        subject: "¡Digitalizá los pedidos de tu restaurante con Dale! Te Pido!",
        body: "Hola {name}, te presentamos la plataforma líder para recibir pedidos directo por WhatsApp sin comisiones por venta. Podés tener tu carta digital lista en 5 minutos."
      },
      indumentaria: {
        subject: "Tu tienda de indumentaria con catálogo online y pedidos por WhatsApp",
        body: "Hola {name}, mostrá todas tus prendas, talles y colores en un catálogo web moderno y recibí los pedidos organizados directamente en tu WhatsApp."
      },
      ferreteria: {
        subject: "Catálogo digital para tu Ferretería — Pedidos rápidos y ordenados",
        body: "Hola {name}, organizá tus herramientas y productos en un catálogo web fácil de usar para que tus clientes te pidan en segundos."
      },
      general: {
        subject: "Impulsá las ventas de tu negocio con Dale! Te Pido",
        body: "Hola {name}, creá tu tienda online profesional en 15 días gratis. Sin tarjeta de crédito y con soporte técnico dedicado."
      }
    };

    function loadPreset() {
      const val = document.getElementById('prospect-preset').value;
      const preset = presets[val] || presets.general;
      const name = document.getElementById('prospect-name').value || 'tu negocio';
      document.getElementById('prospect-subject').value = preset.subject;
      document.getElementById('prospect-body').value = preset.body.replace('{name}', name);
      updatePreview();
    }

    function updatePreview() {
      const subject = document.getElementById('prospect-subject').value;
      const body = document.getElementById('prospect-body').value;
      const name = document.getElementById('prospect-name').value || 'Comercio';

      const iframe = document.getElementById('preview-iframe');
      const html = `
        <!DOCTYPE html>
        <html lang="es">
        <head>
          <meta charset="UTF-8">
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0d0b0b; color: #ffffff; margin: 0; padding: 20px 10px; }
            .container { max-width: 580px; margin: 0 auto; background-color: #171313; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
            .header { background: linear-gradient(135deg, #D60000 0%, #7A0000 100%); padding: 32px 24px; text-align: center; }
            .logo-sub { color: rgba(255,255,255,0.8); font-size: 12px; margin-top: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; }
            .content { padding: 32px 24px; }
            .greeting { font-size: 22px; font-weight: 800; color: #ffffff; margin-bottom: 16px; }
            .badge { display: inline-block; padding: 6px 16px; border-radius: 50px; font-size: 13px; font-weight: 700; margin-bottom: 20px; background: rgba(214, 0, 0, 0.18); border: 1px solid #D60000; color: #ff6666; }
            .text { font-size: 15px; color: #cccccc; line-height: 1.6; margin-bottom: 24px; }
            .btn-container { text-align: center; margin: 28px 0; }
            .btn-primary { background: linear-gradient(135deg, #D60000 0%, #b30000 100%); color: #ffffff !important; padding: 16px 36px; border-radius: 12px; font-weight: 800; font-size: 16px; text-decoration: none; display: inline-block; box-shadow: 0 8px 24px rgba(214,0,0,0.4); text-transform: uppercase; letter-spacing: 0.5px; }
            .box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 20px; margin-bottom: 24px; border-left: 4px solid #22D3EE; }
            .footer { background-color: #080606; padding: 20px; text-align: center; font-size: 12px; color: #555555; }
          </style>
        </head>
        <body>
          <div class="container">
            <div class="header">
              <img src="https://res.cloudinary.com/deuog0r34/image/upload/v1778811606/daletepido-logo-white_zpcolq.png" alt="Dale Te Pido" style="max-width: 220px; width: 80%; height: auto; display: block; margin: 0 auto;">
              <div class="logo-sub">Catálogos & Presupuestos Online</div>
            </div>
            <div class="content">
              <div class="greeting">${subject || 'Impulsá las ventas de tu negocio'}</div>
              <div class="badge">🚀 15 Días de Prueba Gratis Sin Compromiso</div>
              <div class="text">
                <strong>Hola ${name},</strong><br/><br/>
                ${body ? body.replace(/\n/g, '<br>') : 'Contenido del correo...'}
              </div>
              <div class="btn-container">
                <a href="https://daletepido.com.ar" class="btn-primary" target="_blank">🚀 Probar 15 Días Gratis</a>
              </div>
              <div class="box">
                <div style="font-size:13.5px; color:#dddddd; line-height:1.6;">
                  🎁 <strong>Soporte Técnico Dedicado:</strong> Si tenés alguna pregunta o querés ayuda configurando tu catálogo, respondé a este correo y te asistimos al instante.
                </div>
              </div>
            </div>
            <div class="footer">
              © 2026 Dale! Te Pido · Tu catálogo online profesional sin comisiones por venta.
            </div>
          </div>
        </body>
        </html>
      `;
      iframe.srcdoc = html;
    }

    async function sendEmail() {
      const email = document.getElementById('prospect-email').value;
      const name = document.getElementById('prospect-name').value;
      const subject = document.getElementById('prospect-subject').value;
      const body = document.getElementById('prospect-body').value;
      const statusEl = document.getElementById('status-msg');

      if (!email) {
        alert('Por favor ingrese el correo del prospecto.');
        return;
      }

      statusEl.style.display = 'block';
      statusEl.style.color = '#2563EB';
      statusEl.textContent = 'Enviando correo al prospecto...';

      try {
        const res = await fetch('/api/welcome-email', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-super-admin-key': masterToken
          },
          body: JSON.stringify({
            action: 'send_prospect',
            to: email,
            name: name,
            subject: subject,
            custom_body: body
          })
        });
        const data = await res.json();
        if (data.success) {
          statusEl.style.color = '#16A34A';
          statusEl.textContent = '✓ Correo enviado con éxito al prospecto.';
        } else {
          statusEl.style.color = '#DC2626';
          statusEl.textContent = '✕ Error: ' + (data.error || 'No se pudo enviar el correo.');
        }
      } catch (err) {
        statusEl.style.color = '#DC2626';
        statusEl.textContent = '✕ Error de red: ' + err.message;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadPreset();
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Dale!TePido - 60s 3-Way Store Comparison</title>
    <!-- Google Fonts: Josefin Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Josefin Sans';
        font-style: normal;
        font-weight: 400 800;
        src: local('Josefin Sans'), url('https://fonts.gstatic.com/s/josefinsans/v32/Qw3aZQNVED7rKGKxtqIqX5E-AVSJrOCfjY46_DjQbMZhKg.woff2') format('woff2');
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #F6F6F6;
        font-family: 'Josefin Sans', sans-serif;
        color: #010101;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #F6F6F6;
      }

      .clip {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-v63y"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1080"
      data-height="1920"
    >
      <!-- Scene 1: Hook & El Ticket de $60.000 (0.0s - 12.0s) -->
      <div data-hf-id="hf-nhut"
        id="scene-1-hook"
        class="clip"
        data-composition-id="scene-1-hook"
        data-composition-src="compositions/scene-1-hook.html"
        data-start="0"
        data-duration="12"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Scene 2: Logística y Reparto (12.0s - 24.0s) -->
      <div data-hf-id="hf-t3ms"
        id="scene-2-logistica"
        class="clip"
        data-composition-id="scene-2-logistica"
        data-composition-src="compositions/scene-2-logistica.html"
        data-start="12"
        data-duration="12"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Scene 3: Posicionamiento vs. Kit QR (24.0s - 36.0s) -->
      <div data-hf-id="hf-wyyh"
        id="scene-3-posicionamiento"
        class="clip"
        data-composition-id="scene-3-posicionamiento"
        data-composition-src="compositions/scene-3-posicionamiento.html"
        data-start="24"
        data-duration="12"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Scene 4: Conflictos y Fidelización (36.0s - 48.0s) -->
      <div data-hf-id="hf-ru8p"
        id="scene-4-conflictos"
        class="clip"
        data-composition-id="scene-4-conflictos"
        data-composition-src="compositions/scene-4-conflictos.html"
        data-start="36"
        data-duration="12"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Scene 5: Cierre Semanal & Control de Stock (48.0s - 60.0s) -->
      <div data-hf-id="hf-ccx4"
        id="scene-5-cierre-semanal"
        class="clip"
        data-composition-id="scene-5-cierre-semanal"
        data-composition-src="compositions/scene-5-cierre-semanal.html"
        data-start="48"
        data-duration="12"
        data-track-index="4"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

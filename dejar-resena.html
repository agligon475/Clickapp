<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dejar una Reseña — Dale! Te Pido</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F6F6F6">
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <style>
    :root {
      --bg: #F6F6F6;
      --card-bg: #FFFFFF;
      --border-color: #E2E8F0;
      --red-primary: #F60000;
      --red-hover: #D60000;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --yellow-star: #F59E0B;
      --input-bg: #FAFAFC;
      --font-title: 'Josefin Sans', sans-serif;
      --font-body: 'Poppins', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B0F17;
        --card-bg: #151C2C;
        --border-color: #24304A;
        --text-main: #F8FAFC;
        --text-muted: #94A3B8;
        --input-bg: #0E1322;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      background-image: radial-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      }
    }

    header {
      padding: 16px 28px;
      border-bottom: 1px solid var(--border-color);
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .brand img {
      height: 32px;
      width: auto;
      filter: brightness(0);
      transition: filter 0.2s;
    }
    @media (prefers-color-scheme: dark) {
      .brand img {
        filter: brightness(0) invert(1);
      }
    }

    .brand-title {
      font-family: var(--font-title);
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }

    .review-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.07);
    }

    .card-title {
      font-family: var(--font-title);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-main);
    }

    .card-sub {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-label span.badge-vis {
      font-size: 10px;
      color: #059669;
      background: rgba(16,185,129,0.12);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      text-transform: none;
      font-weight: 600;
    }

    .form-label span.badge-priv {
      font-size: 10px;
      color: #2563eb;
      background: rgba(37,99,235,0.12);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      text-transform: none;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      font-family: var(--font-body);
    }

    .form-control:focus {
      border-color: var(--red-primary);
      background: var(--card-bg);
      box-shadow: 0 0 0 3px rgba(246, 0, 0, 0.12);
    }

    textarea.form-control {
      min-height: 110px;
      resize: vertical;
    }

    /* Star Rating Widget */
    .star-rating {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .star-rating i {
      font-size: 28px;
      color: #CBD5E1;
      cursor: pointer;
      transition: transform 0.15s ease, color 0.15s ease;
    }
    @media (prefers-color-scheme: dark) {
      .star-rating i {
        color: rgba(255, 255, 255, 0.2);
      }
    }

    .star-rating i:hover,
    .star-rating i.active {
      color: var(--yellow-star);
      transform: scale(1.15);
    }

    .btn-submit {
      width: 100%;
      background: var(--red-primary);
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(246, 0, 0, 0.25);
      letter-spacing: 0.02em;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: var(--red-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(246, 0, 0, 0.35);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .success-box {
      display: none;
      text-align: center;
      padding: 24px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 14px;
      color: #10b981;
      font-weight: 600;
    }

    footer {
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand">
      <img src="https://res.cloudinary.com/deuog0r34/image/upload/v1778811606/daletepido-logo-white_zpcolq.png" onerror="this.src='/img-default/daletepido-logo-white-hq.png'" alt="Dale! Te Pido">
    </a>
  </header>

  <main>
    <div class="review-card">
      <div class="card-title">
        <i class="bi bi-star-fill" style="color: var(--yellow-star);"></i> Dejanos tu Reseña
      </div>
      <div class="card-sub">
        Tu experiencia ayuda a otros comercios y gastronómicos a vender online sin comisiones.
      </div>

      <div id="success-message" class="success-box">
        <i class="bi bi-check-circle-fill" style="font-size: 36px; margin-bottom: 12px; display: block;"></i>
        <strong style="font-size: 18px; color: #fff;">¡Muchas gracias por tu opinión!</strong>
        <p style="font-size: 14px; margin-top: 8px; color: #a7f3d0;">
          Tu reseña ha sido guardada exitosamente y aparecerá publicada en nuestro sitio web.
        </p>
      </div>

      <form id="review-form" onsubmit="submitReview(event)">
        <div class="form-group">
          <label class="form-label">Tu Nombre y Apellido <span class="badge-vis">👁️ Visible en la reseña</span></label>
          <input type="text" id="review-name" class="form-control" placeholder="Ej. Juan Pérez" required />
        </div>

        <div class="form-group">
          <label class="form-label">Nombre de tu Empresa / Tienda <span class="badge-vis">👁️ Visible en la reseña</span></label>
          <input type="text" id="review-company" class="form-control" placeholder="Ej. Pizzería Don Antonio" required />
        </div>

        <div class="form-group">
          <label class="form-label">Tu Correo Electrónico <span class="badge-priv">🔒 No visible públicamente</span></label>
          <input type="email" id="review-email" class="form-control" placeholder="comercio@ejemplo.com" required />
        </div>

        <div class="form-group">
          <label class="form-label">Calificación (0 a 5 estrellas) <span class="badge-vis">👁️ Visible</span></label>
          <div class="star-rating" id="star-container">
            <i class="bi bi-star-fill" data-star="1" onclick="setRating(1)"></i>
            <i class="bi bi-star-fill" data-star="2" onclick="setRating(2)"></i>
            <i class="bi bi-star-fill" data-star="3" onclick="setRating(3)"></i>
            <i class="bi bi-star-fill" data-star="4" onclick="setRating(4)"></i>
            <i class="bi bi-star-fill" data-star="5" onclick="setRating(5)"></i>
          </div>
          <input type="hidden" id="review-rating" value="5" />
        </div>

        <div class="form-group">
          <label class="form-label">Tu Opinión o Experiencia <span class="badge-vis">👁️ Visible en la reseña</span></label>
          <textarea id="review-comment" class="form-control" placeholder="Contanos cómo te sirvió Dale! Te Pido para recibir pedidos por WhatsApp..." required></textarea>
        </div>

        <button type="submit" id="btn-submit-review" class="btn-submit">
          🚀 Enviar Mi Reseña
        </button>
      </form>
    </div>
  </main>

  <footer>
    © 2026 Dale! Te Pido · Catálogos y Presupuestos Online sin comisiones.
  </footer>

  <script>
    const SUPABASE_URL = 'https://iaylgsthwildjkiiwgfd.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlheWxnc3Rod2lsZGpraWl3Z2ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyOTQwODksImV4cCI6MjA5Mzg3MDA4OX0.4aysjORaQ_158r9CFgLSkcqmwpHFXsxZ9T18jEMF6z4';

    let currentRating = 5;

    function setRating(val) {
      currentRating = val;
      document.getElementById('review-rating').value = val;
      
      const stars = document.querySelectorAll('#star-container i');
      stars.forEach((star, idx) => {
        if (idx < val) {
          star.classList.add('active');
        } else {
          star.classList.remove('active');
        }
      });
    }

    // Set initial 5 stars
    window.addEventListener('DOMContentLoaded', () => {
      // Auto pre-fill storeId if passed in query param
      const urlParams = new URLSearchParams(window.location.search);
      const storeId = urlParams.get('store');
      if (storeId) {
        document.getElementById('review-company').value = storeId;
      }
      setRating(5);
    });

    async function submitReview(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btn-submit-review');
      btn.disabled = true;
      btn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Enviando...';

      const urlParams = new URLSearchParams(window.location.search);
      const storeId = urlParams.get('store') || '';

      const payload = {
        store_id: storeId,
        name: document.getElementById('review-name').value.trim(),
        company: document.getElementById('review-company').value.trim(),
        email: document.getElementById('review-email').value.trim(),
        comment: document.getElementById('review-comment').value.trim(),
        rating: parseInt(currentRating, 10),
        approved: true
      };

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/reviews`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          document.getElementById('review-form').style.display = 'none';
          document.getElementById('success-message').style.display = 'block';
        } else {
          const err = await res.json();
          alert('Error al guardar reseña: ' + (err.message || 'Intente nuevamente'));
          btn.disabled = false;
          btn.innerHTML = '🚀 Enviar Mi Reseña';
        }
      } catch (err) {
        alert('Error de conexión: ' + err.message);
        btn.disabled = false;
        btn.innerHTML = '🚀 Enviar Mi Reseña';
      }
    }
  </script>
</body>
</html>

apply plugin: 'com.android.application'

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'ar.com.daletepido.app'
    compileSdk 34

    defaultConfig {
        applicationId "ar.com.daletepido.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        manifestPlaceholders = [
            hostName: "daletepido.com.ar",
            defaultUrl: "https://daletepido.com.ar/alta-usuario.html?action=login",
            launcherName: "DaleTePido"
        ]
    }

    signingConfigs {
        release {
            storeFile file('daletepido.keystore')
            storePassword 'daletepido2026'
            keyAlias 'daletepido'
            keyPassword 'daletepido2026'
        }
        debug {
            storeFile file('daletepido.keystore')
            storePassword 'daletepido2026'
            keyAlias 'daletepido'
            keyPassword 'daletepido2026'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}

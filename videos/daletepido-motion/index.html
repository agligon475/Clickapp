<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Dale!TePido - 30s High-Impact Kinetic Motion</title>
    <!-- Google Fonts: Josefin Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Josefin Sans';
        font-style: normal;
        font-weight: 400 800;
        src: local('Josefin Sans'), url('https://fonts.gstatic.com/s/josefinsans/v32/Qw3aZQNVED7rKGKxtqIqX5E-AVSJrOCfjY46_DjQbMZhKg.woff2') format('woff2');
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #010101;
        font-family: 'Josefin Sans', sans-serif;
        color: #F6F6F6;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #010101;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- Scene 1: The Hook & Brand Reveal [DARK THEME] (0.0s - 4.5s) -->
      <div
        id="scene-1-hook"
        class="clip"
        data-composition-id="scene-1-hook"
        data-composition-src="compositions/scene-1-hook.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Scene 2: Ventaja 1 — Cero Comisiones [LIGHT THEME] (4.5s - 9.0s) -->
      <div
        id="scene-2-comisiones"
        class="clip"
        data-composition-id="scene-2-comisiones"
        data-composition-src="compositions/scene-2-comisiones.html"
        data-start="4.5"
        data-duration="4.5"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Scene 3: Ventaja 2 — Tienda Lista en 5 Minutos [LIGHT THEME] (9.0s - 13.5s) -->
      <div
        id="scene-3-tienda-rapida"
        class="clip"
        data-composition-id="scene-3-tienda-rapida"
        data-composition-src="compositions/scene-3-tienda-rapida.html"
        data-start="9"
        data-duration="4.5"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Scene 4: Ventaja 3 — WhatsApp Directo [LIGHT THEME] (13.5s - 18.0s) -->
      <div
        id="scene-4-whatsapp-directo"
        class="clip"
        data-composition-id="scene-4-whatsapp-directo"
        data-composition-src="compositions/scene-4-whatsapp-directo.html"
        data-start="13.5"
        data-duration="4.5"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Scene 5: Ventaja 4 — Adelanto de Pedidos & Logística [DARK THEME] (18.0s - 23.0s) -->
      <div
        id="scene-5-logistica-adelanto"
        class="clip"
        data-composition-id="scene-5-logistica-adelanto"
        data-composition-src="compositions/scene-5-logistica-adelanto.html"
        data-start="18"
        data-duration="5"
        data-track-index="4"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Scene 6: Ventaja 5 — Kit QR de Mostrador [DARK THEME] (23.0s - 27.5s) -->
      <div
        id="scene-6-kit-qr"
        class="clip"
        data-composition-id="scene-6-kit-qr"
        data-composition-src="compositions/scene-6-kit-qr.html"
        data-start="23"
        data-duration="4.5"
        data-track-index="5"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Scene 7: Outro & Call to Action [DARK THEME] (27.5s - 30.0s) -->
      <div
        id="scene-7-outro"
        class="clip"
        data-composition-id="scene-7-outro"
        data-composition-src="compositions/scene-7-outro.html"
        data-start="27.5"
        data-duration="2.5"
        data-track-index="6"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

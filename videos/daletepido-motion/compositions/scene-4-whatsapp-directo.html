          font-weight: 600;
          color: #E2E8F0;

        .order-footer-total {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding-top: 14px;
          border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .order-total-lbl {

          color: #94A3B8;
        }

        .order-total-val {

          font-weight: 700;

        .bottom-pill-tag {

          border-radius: 999px;
          background: #111827;
          border: 1.5px solid #25D366;

      <script>
        const tl = gsap.timeline({ paused: true });

        // Background pulse
        tl.fromTo(
          "#ambient-w",
          { scale: 0.9, opacity: 0.5 },
          { scale: 1.25, opacity: 0.85, duration: 5.0, ease: "none" },
          0
        );

        // Pill enter
        tl.fromTo(
          "#w-pill",
          { opacity: 0, y: -40, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" },
          0.1
        );

        // Voice tag cross enter
        tl.fromTo(
          "#w-voice-tag",
          { opacity: 0, y: 30, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power2.out" },
          0.35
        );

        // Order card slides down with spring
        tl.fromTo(
          "#w-card",
          { opacity: 0, y: 70, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.6)" },
          0.7
        );

        // Bottom tag
        tl.fromTo(
          "#w-bottom-pill",
          { opacity: 0, y: 30, scale: 0.85 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.8)" },
          1.5
        );

        // Kinetic exit snap (4.7s - 5.0s)
        tl.to(
          "#scene-4-wrap",
          { opacity: 0, scale: 0.9, y: -60, duration: 0.28, ease: "power2.in" },
          4.72
        );

        window.__timelines["scene-4-whatsapp-directo"] = tl;
      </script>

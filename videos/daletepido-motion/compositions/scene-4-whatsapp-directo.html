<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Josefin Sans';
          font-style: normal;
          font-weight: 400 800;
          src: local('Josefin Sans'), url('https://fonts.gstatic.com/s/josefinsans/v32/Qw3aZQNVED7rKGKxtqIqX5E-AVSJrOCfjY46_DjQbMZhKg.woff2') format('woff2');
        }

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: #010101;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Josefin Sans', sans-serif;
          color: #F6F6F6;
          padding: 60px 40px;
        }

        .ambient-glow {
          position: absolute;
          width: 900px;
          height: 900px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(37, 211, 102, 0.16) 0%, rgba(246, 0, 0, 0.08) 40%, rgba(0, 0, 0, 0) 70%);
          pointer-events: none;
          z-index: 1;
        }

        .scene-wrap {
          position: relative;
          z-index: 5;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 100%;
          max-width: 960px;
          gap: 28px;
        }

        .scene-badge {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 12px 32px;
          border-radius: 999px;
          background: #F60000;
          color: #FFFFFF;
          font-size: 24px;
          font-weight: 800;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          box-shadow: 0 8px 30px rgba(246, 0, 0, 0.5);
        }

        /* Punch text: Chau audios eternos */
        .audio-strike-pill {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 14px 28px;
          border-radius: 999px;
          background: rgba(239, 68, 68, 0.12);
          border: 1.5px solid rgba(239, 68, 68, 0.4);
          color: #EF4444;
          font-size: 24px;
          font-weight: 800;
        }

        .strike-text {
          text-decoration: line-through;
        }

        /* Clean Incoming WhatsApp Comanda Card */
        .comanda-card {
          width: 100%;
          max-width: 920px;
          background: #111B21;
          border: 2px solid rgba(37, 211, 102, 0.4);
          border-radius: 36px;
          padding: 36px 40px;
          display: flex;
          flex-direction: column;
          gap: 24px;
          box-shadow: 0 32px 80px rgba(0, 0, 0, 0.9), 0 0 50px rgba(37, 211, 102, 0.2);
        }

        .comanda-top {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding-bottom: 20px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .wa-brand {
          display: flex;
          align-items: center;
          gap: 14px;
        }

        .wa-icon {
          width: 44px;
          height: 44px;
          border-radius: 12px;
          background: #25D366;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 4px 14px rgba(37, 211, 102, 0.4);
        }

        .wa-icon svg {
          width: 26px;
          height: 26px;
          fill: white;
        }

        .wa-name {
          font-size: 26px;
          font-weight: 800;
          color: #E9EDEF;
        }

        .wa-badge {
          padding: 8px 18px;
          border-radius: 999px;
          background: rgba(37, 211, 102, 0.15);
          color: #25D366;
          font-size: 18px;
          font-weight: 800;
        }

        .comanda-order-title {
          font-size: 32px;
          font-weight: 800;
          color: #FFFFFF;
        }

        .comanda-items {
          display: flex;
          flex-direction: column;
          gap: 12px;
          font-size: 24px;
          color: #D1D5DB;
        }

        .item-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .total-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding-top: 16px;
          border-top: 2px dashed rgba(255, 255, 255, 0.15);
          font-size: 32px;
          font-weight: 800;
          color: #34D399;
        }

        .comanda-callout {
          padding: 16px 24px;
          border-radius: 18px;
          background: rgba(246, 0, 0, 0.12);
          border: 1.5px solid rgba(246, 0, 0, 0.4);
          color: #F60000;
          font-size: 22px;
          font-weight: 700;
          text-align: center;
        }

        .bottom-pill {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 14px 32px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.05);
          border: 1.5px solid rgba(255, 255, 255, 0.15);
          color: #FFFFFF;
          font-size: 22px;
          font-weight: 700;
          letter-spacing: 0.06em;
          text-transform: uppercase;
        }
      </style>

      <div id="root" data-composition-id="scene-4-whatsapp-directo" data-width="1080" data-height="1920">
        <div class="ambient-glow" id="ambient-glow"></div>

        <div class="scene-wrap" id="scene-wrap">
          <!-- Headline Badge -->
          <div class="scene-badge" id="scene-badge">
            3. PEDIDOS DIRECTOS A WHATSAPP
          </div>

          <!-- Punch text: Chau audios -->
          <div class="audio-strike-pill" id="audio-pill">
            <span>✕</span>
            <span class="strike-text">¡Chau a los audios eternos de 3 minutos!</span>
          </div>

          <!-- Incoming Comanda Card -->
          <div class="comanda-card" id="comanda-card">
            <div class="comanda-top">
              <div class="wa-brand">
                <div class="wa-icon">
                  <svg viewBox="0 0 24 24">
                    <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 6.46 17.5 2 12.04 2M12.05 3.67C16.58 3.67 20.28 7.37 20.28 11.92C20.28 16.46 16.58 20.17 12.05 20.17C10.57 20.17 9.15 19.77 7.91 19.03L7.61 18.85L4.5 19.67L5.33 16.63L5.13 16.32C4.32 15.03 3.8 13.5 3.8 11.91C3.8 7.37 7.51 3.67 12.05 3.67Z"/>
                  </svg>
                </div>
                <div class="wa-name">WhatsApp Business</div>
              </div>
              <div class="wa-badge">COMANDA CONFIRMADA</div>
            </div>

            <div class="comanda-order-title">
              Pedido #1084 - Retiro Take Away / Envíos Propios
            </div>

            <div class="comanda-items">
              <div class="item-row">
                <span>1x Promo Burger Doble Cheddar + Papas</span>
                <span style="font-weight: 700;">$8.500</span>
              </div>
              <div class="item-row">
                <span>1x Bebida Línea Cola 500ml</span>
                <span style="font-weight: 700;">$1.500</span>
              </div>
              <div class="total-row">
                <span>Total a cobrar:</span>
                <span>$10.000</span>
              </div>
            </div>

            <div class="comanda-callout">
              💬 Sin intermediarios: coordinás el pago directo por tu chat
            </div>
          </div>

          <!-- Bottom Pill -->
          <div class="bottom-pill" id="bottom-pill">
            PEDIDOS CLAROS, AUTOMÁTICOS Y SIN ERRORES
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Initial states
        gsap.set("#scene-wrap", { opacity: 1, scale: 1 });
        gsap.set("#scene-badge", { scale: 0.8, opacity: 0 });
        gsap.set("#audio-pill", { y: -20, opacity: 0 });
        gsap.set("#comanda-card", { y: -80, opacity: 0, scale: 0.92 });
        gsap.set("#bottom-pill", { y: 20, opacity: 0 });

        // 0.0s - 0.5s: Badge & Audio Strike
        tl.fromTo("#scene-badge",
          { scale: 0.75, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" },
          0.05
        );

        tl.fromTo("#audio-pill",
          { y: -20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
          0.35
        );

        // 0.7s: Clean Comanda Card drops from top edge with spring bounce
        tl.fromTo("#comanda-card",
          { y: -80, opacity: 0, scale: 0.92 },
          { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.7)" },
          0.7
        );

        // Comanda attention bounce
        tl.to("#comanda-card", {
          scale: 1.02,
          duration: 0.18,
          repeat: 1,
          yoyo: true,
          ease: "power2.inOut"
        }, 1.6);

        // Bottom pill appears
        tl.fromTo("#bottom-pill",
          { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
          1.8
        );

        // 4.25s: Punchy Exit Snap
        tl.to("#scene-wrap", {
          scale: 1.08,
          opacity: 0,
          duration: 0.22,
          ease: "power2.in"
        }, 4.25);

        window.__timelines["scene-4-whatsapp-directo"] = tl;
      </script>
    </template>
  </body>
</html>

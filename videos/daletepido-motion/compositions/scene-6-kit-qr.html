        const tl = gsap.timeline({ paused: true });

        // Initial setup
        gsap.set("#scene-badge", { autoAlpha: 0, scale: 0.9 });
        gsap.set(".scene-headline", { autoAlpha: 0, y: -20 });
        gsap.set("#stand-container", { autoAlpha: 0, scale: 0.88 });
        gsap.set("#subtext-card", { autoAlpha: 0, y: 20 });

        // 0.0s - 0.6s: Stand pops in with 3D perspective
        tl.to([".scene-badge", ".scene-headline"], {
          autoAlpha: 1,
          scale: 1,
          y: 0,
          duration: 0.45,
          stagger: 0.1,
          ease: "power3.out"
        }, 0.1);

        tl.to("#stand-container", {
          autoAlpha: 1,
          scale: 1,
          duration: 0.65,
          ease: "back.out(1.8)"

          { rotateX: 25, rotateY: -16, scale: 0.9 },
          { rotateX: 12, rotateY: -8, scale: 1, duration: 0.9, ease: "power2.out" },

        );

        tl.to("#subtext-card", {
          autoAlpha: 1,
          y: 0,
          duration: 0.45,
          ease: "back.out(1.6)"
        }, 1.2);

        // Exit transition
        tl.to("#scene-wrap", {
          autoAlpha: 0.2,
          scale: 0.95,
          duration: 0.25,
          ease: "power2.in"
        }, 4.2);

          { scale: 3.5, opacity: 0, duration: 1.4, ease: "power2.out" },

          ["#b-card-1", "#b-card-2", "#b-card-3"],
          { opacity: 0, y: 40, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, stagger: 0.15, ease: "back.out(1.5)" },

          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.8)" },

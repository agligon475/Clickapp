      <script>
        const tl = gsap.timeline({ paused: true });

        // Initial States
        gsap.set("#bento-container", { opacity: 0, scale: 0.92 });
        gsap.set(".rubro-chip", { opacity: 0, y: 20 });
        gsap.set("#chau-blanco", { opacity: 0, scale: 0.85 });
        gsap.set(".category-card", { opacity: 0, x: -30 });
        gsap.set("#wa-order-card", { autoAlpha: 0, y: -80, scale: 0.92 });
        gsap.set("#bottom-badge", { opacity: 0, y: 20 });

        // 0.0s - 0.7s: Smooth Camera Zoom into Bento Container
        tl.fromTo("#bento-container",
          { scale: 0.92, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.65, ease: "back.out(1.4)" },
          0.05
        );

        tl.fromTo("#ambient-glow",
          { scale: 0.7, opacity: 0.2 },
          { scale: 1.1, opacity: 0.6, duration: 1.0, ease: "power2.out" },
          0.1
        );

        // Step A: Rubro Chip Selection
        tl.fromTo(".rubro-chip",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, stagger: 0.08, duration: 0.4, ease: "power3.out" },
          0.35
        );

        tl.fromTo("#chip-gastro",
          { scale: 0.9 },
          { scale: 1.08, duration: 0.25, repeat: 1, yoyo: true, ease: "back.out(2)" },
          0.75
        );

        // Step B: Chau pantalla en blanco & 5 categories slide in
        tl.fromTo("#chau-blanco",
          { opacity: 0, scale: 0.85 },
          { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" },
          1.1
        );

        tl.fromTo(".category-card",
          { opacity: 0, x: -30 },
          { opacity: 1, x: 0, stagger: 0.12, duration: 0.45, ease: "power3.out" },
          1.3
        );

        tl.fromTo("#bottom-badge",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          2.2
        );

        // Step C: Incoming Order Alert Triggers (2.9s relative)
        tl.fromTo("#wa-order-card",
          { autoAlpha: 0, y: -80, scale: 0.92 },
          { autoAlpha: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.7)" },
          2.9
        );

        // WhatsApp card subtle haptic bounce
        tl.to("#wa-order-card", {
          scale: 1.02,
          duration: 0.18,
          repeat: 1,
          yoyo: true,
          ease: "power2.inOut"
        }, 3.5);

        // 5.2s - 5.5s: Recede transition towards Scene 3
        tl.to("#bento-container", {
          scale: 0.86,
          opacity: 0,
          duration: 0.28,
          ease: "power2.in"
        }, 5.2);

        window.__timelines["scene-2-onboarding"] = tl;
      </script>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Initial setup
        gsap.set("#bento-wrap", { scale: 0.94, opacity: 0, y: 30 });
        gsap.set("#tap-cursor", { x: 180, y: 35, opacity: 0 });

        // 0.0s - 0.5s: Fast slide entrance to Light Theme Bento Grid
        tl.to("#bento-wrap", {
          scale: 1,
          opacity: 1,
          y: 0,
          duration: 0.5,
          ease: "power3.out"
        }, 0.05);

        // 0.6s - 1.4s: Tap simulation on rubro chip
        tl.to("#tap-cursor", {
          opacity: 1,
          scale: 1,
          duration: 0.25,
          ease: "power2.out"
        }, 0.6);

        tl.to("#tap-cursor", {
          scale: 0.6,
          duration: 0.15,
          ease: "power1.in"
        }, 0.85);

        // Chip turns solid red #F60000 with white text!
        tl.to("#chip-almacen", {
          backgroundColor: "#F60000",
          color: "#FFFFFF",
          borderColor: "#F60000",
          scale: 1.04,
          boxShadow: "0 10px 25px rgba(246, 0, 0, 0.35)",
          duration: 0.25,
          ease: "back.out(2)"
        }, 0.95);

        tl.to("#tap-cursor", {
          opacity: 0,
          scale: 1.4,
          duration: 0.25
        }, 1.1);

        // 1.5s - 2.8s: Blank screen pill drops & 5 category cards cascade
        tl.to("#blank-screen-pill", {
          opacity: 1,
          y: 0,
          duration: 0.35,
          ease: "back.out(1.6)"
        }, 1.4);

        const cats = ["#cat-1", "#cat-2", "#cat-3", "#cat-4", "#cat-5"];
        tl.to(cats, {
          opacity: 1,
          x: 0,
          duration: 0.4,
          stagger: 0.12,
          ease: "back.out(1.5)"
        }, 1.7);

        // 3.0s - 5.2s: Incoming order notification drops from the top
        tl.to("#order-card", {
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 0.55,
          ease: "bounce.out"
        }, 3.0);

        // Subtle glow pulse on the order card
        tl.fromTo("#order-card",
          { boxShadow: "0 20px 50px rgba(0, 0, 0, 0.25), 0 0 20px rgba(246, 0, 0, 0.1)" },
          { boxShadow: "0 20px 60px rgba(0, 0, 0, 0.35), 0 0 50px rgba(246, 0, 0, 0.35)", duration: 0.4, yoyo: true, repeat: 2 },
          3.6
        );

        // 5.2s: Outro fade preparing for Scene 3 snap back to Dark theme
        tl.to("#bento-wrap", {
          opacity: 0.2,
          scale: 0.95,
          duration: 0.25,
          ease: "power2.in"
        }, 5.2);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene-2-onboarding"] = tl;
      </script>

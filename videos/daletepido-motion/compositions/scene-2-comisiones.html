<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Josefin Sans';
          font-style: normal;
          font-weight: 400 700;
          src: local('Josefin Sans'), url('https://fonts.gstatic.com/s/josefinsans/v32/Qw3aZQNVED7rKGKxtqIqX5E-AVSJrOCfjY46_DjQbMZhKg.woff2') format('woff2');
        }

        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #010101;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Josefin Sans', sans-serif;
          color: #F6F6F6;
          padding: 80px 50px;
        }

        .ambient-glow-c {
          position: absolute;
          width: 900px;
          height: 900px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(246, 0, 0, 0.28) 0%, rgba(246, 0, 0, 0) 70%);
          pointer-events: none;
        }

        .scene-wrap {
          position: relative;
          z-index: 2;
          width: 960px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 28px;
        }

        .step-pill {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 14px 34px;
          border-radius: 999px;
          background: rgba(246, 0, 0, 0.14);
          border: 1.5px solid #F60000;
          font-size: 26px;
          font-weight: 700;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #FFFFFF;
        }

        .step-pill-num {
          background: #F60000;
          color: #FFFFFF;
          padding: 4px 14px;
          border-radius: 999px;
          font-size: 22px;
        }

        .hero-counter-box {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          margin: 10px 0;
        }

        .shockwave-ring {
          position: absolute;
          width: 380px;
          height: 380px;
          border-radius: 50%;
          border: 3px solid #F60000;
          pointer-events: none;
        }

        .giant-zero {
          font-size: 260px;
          line-height: 0.9;
          font-weight: 700;
          color: #F60000;
          text-shadow: 0 0 60px rgba(246, 0, 0, 0.65), 0 0 120px rgba(246, 0, 0, 0.35);
          letter-spacing: -0.05em;
        }

        .caja-badge {
          display: inline-flex;
          align-items: center;
          gap: 16px;
          padding: 22px 48px;
          border-radius: 28px;
          background: #111827;
          border: 2px solid rgba(255, 255, 255, 0.15);
          box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8);
        }

        .caja-badge-text {
          font-size: 48px;
          font-weight: 700;
          letter-spacing: 0.02em;
          text-transform: uppercase;
          color: #FFFFFF;
        }

        .caja-badge-text span {
          color: #10B981;
          text-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
        }

        .comparison-cards {
          display: flex;
          flex-direction: column;
          gap: 16px;
          width: 100%;
          max-width: 820px;
          margin-top: 10px;
        }

        .comp-card {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 22px 32px;
          border-radius: 20px;
          background: #0E0E0E;
          border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .comp-card.highlight {
          background: #1A0505;
          border-color: #F60000;
          box-shadow: 0 8px 30px rgba(246, 0, 0, 0.25);
        }

        .comp-name {
          font-size: 26px;
          font-weight: 600;
          color: #E2E8F0;
        }

        .comp-val {
          font-size: 28px;
          font-weight: 700;
        }

        .val-red {
          color: #F87171;
          text-decoration: line-through;
        }

        .val-green {
          color: #10B981;
        }
      </style>

      <div id="root" data-composition-id="scene-2-comisiones" data-width="1080" data-height="1920">
        <div id="ambient-c" class="ambient-glow-c"></div>

        <div id="scene-2-wrap" class="scene-wrap">
          <div id="c-pill" class="step-pill">
            <span class="step-pill-num">01</span>
            <span>Cero Comisiones</span>
          </div>

          <div class="hero-counter-box">
            <div id="ring-1" class="shockwave-ring"></div>
            <div id="counter-zero" class="giant-zero">0%</div>
          </div>

          <div id="caja-card" class="caja-badge">
            <div class="caja-badge-text">
              <span>100%</span> EN TU CAJA
            </div>
          </div>

          <div id="comp-box" class="comparison-cards">
            <div id="comp-1" class="comp-card">
              <span class="comp-name">Otras Apps de Delivery</span>
              <span class="comp-val val-red">-30% Comisión</span>
            </div>
            <div id="comp-2" class="comp-card highlight">
              <span class="comp-name">Con Dale!TePido</span>
              <span class="comp-val val-green">$0 Comisión x Venta</span>
            </div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Background pulse
        tl.fromTo(
          "#ambient-c",
          { scale: 0.9, opacity: 0.5 },
          { scale: 1.25, opacity: 0.85, duration: 5.0, ease: "none" },
          0
        );

        // Step pill snap
        tl.fromTo(
          "#c-pill",
          { opacity: 0, y: -40, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" },
          0.1
        );

        // Massive 0% Impact
        tl.fromTo(
          "#counter-zero",
          { scale: 0.2, opacity: 0 },
          { scale: 1.15, opacity: 1, duration: 0.45, ease: "back.out(2.5)" },
          0.35
        );
        tl.to("#counter-zero", { scale: 1.0, duration: 0.25, ease: "power2.out" }, 0.8);

        // Shockwave expansion
        tl.fromTo(
          "#ring-1",
          { scale: 0.6, opacity: 1 },
          { scale: 1.7, opacity: 0, duration: 0.8, ease: "power2.out" },
          0.45
        );

        // 100% en tu caja badge pops
        tl.fromTo(
          "#caja-card",
          { opacity: 0, y: 60, scale: 0.88 },
          { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.8)" },
          0.9
        );

        // Comparison cards enter
        tl.fromTo(
          ["#comp-1", "#comp-2"],
          { opacity: 0, y: 40, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, stagger: 0.15, ease: "power2.out" },
          1.4
        );

        // Subtle attention pulse at 3.0s
        tl.to("#counter-zero", { scale: 1.08, duration: 0.2, ease: "power1.out" }, 3.0);
        tl.to("#counter-zero", { scale: 1.0, duration: 0.2, ease: "power1.in" }, 3.2);

        // Kinetic exit snap (4.7s - 5.0s)
        tl.to(
          "#scene-2-wrap",
          { opacity: 0, scale: 0.9, y: -60, duration: 0.28, ease: "power2.in" },
          4.72
        );

        window.__timelines["scene-2-comisiones"] = tl;
      </script>
    </template>
  </body>
</html>

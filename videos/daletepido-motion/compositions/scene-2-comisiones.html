<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Josefin Sans';
          font-style: normal;
          font-weight: 400 800;
          src: local('Josefin Sans'), url('https://fonts.gstatic.com/s/josefinsans/v32/Qw3aZQNVED7rKGKxtqIqX5E-AVSJrOCfjY46_DjQbMZhKg.woff2') format('woff2');
        }

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: #010101;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Josefin Sans', sans-serif;
          color: #F6F6F6;
          padding: 60px 40px;
        }

        .ambient-glow {
          position: absolute;
          width: 900px;
          height: 900px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(246, 0, 0, 0.24) 0%, rgba(246, 0, 0, 0.05) 45%, rgba(0, 0, 0, 0) 70%);
          pointer-events: none;
          z-index: 1;
        }

        .scene-wrap {
          position: relative;
          z-index: 5;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          width: 100%;
          max-width: 960px;
          gap: 28px;
        }

        /* Large glowing red badge */
        .advantage-badge {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 14px 34px;
          border-radius: 999px;
          background: #F60000;
          color: #FFFFFF;
          font-size: 26px;
          font-weight: 800;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          box-shadow: 0 8px 30px rgba(246, 0, 0, 0.6);
        }

        /* Giant Hero Counter */
        .counter-box {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
          position: relative;
        }

        .giant-number {
          font-size: 190px;
          line-height: 0.9;
          font-weight: 800;
          color: #F60000;
          letter-spacing: -0.04em;
          text-shadow: 0 0 70px rgba(246, 0, 0, 0.8);
        }

        .counter-sub {
          font-size: 38px;
          font-weight: 800;
          letter-spacing: 0.06em;
          color: #F60000;
          text-transform: uppercase;
        }

        /* Split Comparison & Caja Badge */
        .caja-badge {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 14px;
          padding: 18px 40px;
          border-radius: 24px;
          background: rgba(16, 185, 129, 0.12);
          border: 2px solid rgba(16, 185, 129, 0.45);
          color: #34D399;
          font-size: 36px;
          font-weight: 800;
          letter-spacing: 0.04em;
          width: 100%;
          max-width: 860px;
        }

        .comparison-cards {
          display: flex;
          flex-direction: column;
          gap: 14px;
          width: 100%;
          max-width: 860px;
        }

        .comp-card {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 20px 32px;
          border-radius: 20px;
          background: #0D0F12;
          border: 1.5px solid rgba(255, 255, 255, 0.1);
          font-size: 26px;
          font-weight: 700;
        }

        .comp-card.strike {
          opacity: 0.75;
          text-decoration: line-through;
          color: #EF4444;
          border-color: rgba(239, 68, 68, 0.3);
        }

        .comp-card.highlight {
          border-color: rgba(246, 0, 0, 0.5);
          background: #141414;
          color: #FFFFFF;
        }

        .val-pill-green {
          padding: 6px 18px;
          border-radius: 999px;
          background: rgba(16, 185, 129, 0.15);
          color: #34D399;
          font-weight: 800;
        }

        /* Floating Note Card */
        .floating-note {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 14px 28px;
          border-radius: 18px;
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.15);
          font-size: 22px;
          font-weight: 700;
          color: #D1D5DB;
        }
      </style>

      <div id="root" data-composition-id="scene-2-comisiones" data-width="1080" data-height="1920">
        <div class="ambient-glow" id="ambient-glow"></div>

        <div class="scene-wrap" id="scene-wrap">
          <!-- Advantage 1 Badge -->
          <div class="advantage-badge" id="adv-badge">
            1. CERO COMISIONES
          </div>

          <!-- Giant 0% Counter -->
          <div class="counter-box" id="counter-box">
            <div class="giant-number" id="giant-num">0%</div>
            <div class="counter-sub">COMISIÓN POR VENTA</div>
          </div>

          <!-- 100% en tu caja -->
          <div class="caja-badge" id="caja-badge">
            <span>✓ 100% DE LA GANANCIA EN TU CAJA</span>
          </div>

          <!-- Split Comparison Cards -->
          <div class="comparison-cards" id="comp-cards">
            <div class="comp-card strike" id="comp-left">
              <span>Otras Apps de Delivery</span>
              <span>-30% EN COMISIONES</span>
            </div>
            <div class="comp-card highlight" id="comp-right">
              <span>Con Dale!TePido</span>
              <span class="val-pill-green">$0 Comisión x Venta</span>
            </div>
          </div>

          <!-- Floating Note Card -->
          <div class="floating-note" id="floating-note">
            💳 Sin pasarelas ni retenciones complejas
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Initial states
        gsap.set("#scene-wrap", { opacity: 1, scale: 1 });
        gsap.set("#adv-badge", { scale: 0.8, opacity: 0 });
        gsap.set("#counter-box", { scale: 0.7, opacity: 0 });
        gsap.set("#caja-badge", { y: 30, opacity: 0 });
        gsap.set("#comp-cards", { y: 30, opacity: 0 });
        gsap.set("#floating-note", { y: 20, opacity: 0 });

        // 0.0s - 0.6s: Large Glowing Red Badge Emerges
        tl.fromTo("#adv-badge",
          { scale: 0.75, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" },
          0.05
        );

        tl.fromTo("#ambient-glow",
          { scale: 0.7, opacity: 0.3 },
          { scale: 1.2, opacity: 0.8, duration: 1.2, ease: "power2.out" },
          0.1
        );

        // 0.4s - 1.0s: Giant 0% Counter Impact
        tl.fromTo("#counter-box",
          { scale: 0.65, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.2)" },
          0.35
        );

        // 0.8s: 100% en tu caja badge
        tl.fromTo("#caja-badge",
          { y: 35, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" },
          0.8
        );

        // 1.2s: Comparison Cards Slide-in
        tl.fromTo("#comp-cards",
          { y: 30, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
          1.2
        );

        // 1.6s: Floating note card
        tl.fromTo("#floating-note",
          { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
          1.6
        );

        // Attention bounce at 2.6s
        tl.to("#giant-num", {
          scale: 1.05,
          duration: 0.22,
          repeat: 1,
          yoyo: true,
          ease: "sine.inOut"
        }, 2.6);

        // 4.25s: Punchy Exit Snap
        tl.to("#scene-wrap", {
          scale: 1.08,
          opacity: 0,
          duration: 0.22,
          ease: "power2.in"
        }, 4.25);

        window.__timelines["scene-2-comisiones"] = tl;
      </script>
    </template>
  </body>
</html>

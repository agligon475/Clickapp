<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Josefin Sans';
          font-style: normal;
          font-weight: 400 800;
          src: local('Josefin Sans'), url('https://fonts.gstatic.com/s/josefinsans/v32/Qw3aZQNVED7rKGKxtqIqX5E-AVSJrOCfjY46_DjQbMZhKg.woff2') format('woff2');
        }

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: #F6F6F6;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Josefin Sans', sans-serif;
          color: #010101;
          padding: 60px 48px;
        }

        .ambient-light {
          position: absolute;
          width: 900px;
          height: 900px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(246, 0, 0, 0.08) 0%, rgba(246, 0, 0, 0.02) 40%, rgba(246, 246, 246, 0) 70%);
          pointer-events: none;
          z-index: 1;
        }

        .main-card {
          position: relative;
          z-index: 5;
          width: 960px;
          background: #FFFFFF;
          border: 3.5px solid #F60000;
          border-radius: 40px;
          padding: 60px 48px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 36px;
          box-shadow: 0 30px 80px rgba(0, 0, 0, 0.08), 0 0 50px rgba(246, 0, 0, 0.08);
          opacity: 0;
          transform: scale(0.92) translateY(30px);
        }

        .badge-step {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 14px 34px;
          border-radius: 999px;
          background: rgba(246, 0, 0, 0.08);
          border: 1.5px solid rgba(246, 0, 0, 0.3);
          color: #F60000;
          font-size: 26px;
          font-weight: 800;
          letter-spacing: 0.1em;
          text-transform: uppercase;
        }

        .commission-hero {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 10px;
        }

        .stat-zero {
          font-size: 150px;
          line-height: 0.95;
          font-weight: 800;
          color: #F60000;
          letter-spacing: -0.03em;
        }

        .stat-label {
          font-size: 50px;
          font-weight: 800;
          color: #010101;
          line-height: 1.1;
          text-transform: uppercase;
          letter-spacing: -0.01em;
        }

        .crossed-card {
          display: inline-flex;
          align-items: center;
          gap: 14px;
          padding: 14px 28px;
          border-radius: 20px;
          background: #F4F4F5;
          border: 1.5px solid #E4E4E7;
          color: #71717A;
          font-size: 24px;
          font-weight: 700;
          text-decoration: line-through;
          text-decoration-thickness: 3px;
        }

        .sub-badge-card {
          padding: 22px 36px;
          border-radius: 24px;
          background: #0D0F12;
          color: #FFFFFF;
          font-size: 28px;
          font-weight: 700;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          width: 100%;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .pill-note {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 10px 24px;
          border-radius: 999px;
          background: rgba(16, 185, 129, 0.1);
          color: #10B981;
          font-size: 22px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
        }
      </style>

      <div data-hf-id="hf-url8" id="root" data-composition-id="scene-2-comisiones" data-width="1080" data-height="1920">
        <div data-hf-id="hf-yajf" class="ambient-light"></div>

        <div data-hf-id="hf-gsc2" class="main-card" id="main-card">
          <div data-hf-id="hf-6s5i" class="badge-step">⚡ 1. CERO COMISIONES</div>

          <div data-hf-id="hf-cud7" class="crossed-card">
            <span data-hf-id="hf-yc2f">❌</span> -30% EN COMISIONES TRADICIONALES
          </div>

          <div data-hf-id="hf-aqho" class="commission-hero">
            <div data-hf-id="hf-2r76" class="stat-zero">0%</div>
            <div data-hf-id="hf-80vl" class="stat-label">COMISIÓN POR VENTA<br data-hf-id="hf-x5px" /><span data-hf-id="hf-hnex" style="color:#10B981;">100% EN TU CAJA</span></div>
          </div>

          <div data-hf-id="hf-nqgz" class="sub-badge-card">
            Sin retenciones complejas ni pasarelas obligatorias
          </div>

          <div data-hf-id="hf-poh1" class="pill-note">
            ✓ Tu dinero disponible en el acto
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Initial state
        gsap.set("#main-card", { autoAlpha: 0, scale: 0.9, y: 40 });

        // 0.0s - 0.6s: Smooth wipe in to clean white card
        tl.to("#main-card", {
          autoAlpha: 1,
          scale: 1,
          y: 0,
          duration: 0.6,
          ease: "back.out(1.8)"
        }, 0.1);

        // Counter bounce
        tl.fromTo(".stat-zero",
          { scale: 0.8 },
          { scale: 1.06, duration: 0.4, yoyo: true, repeat: 1, ease: "power2.out" },
          0.8
        );

        // Exit transition
        tl.to("#main-card", {
          autoAlpha: 0.2,
          scale: 0.95,
          duration: 0.3,
          ease: "power2.in"
        }, 4.15);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene-2-comisiones"] = tl;
      </script>
    </template>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Josefin Sans';
          font-style: normal;
          font-weight: 400 800;
          src: local('Josefin Sans'), url('https://fonts.gstatic.com/s/josefinsans/v32/Qw3aZQNVED7rKGKxtqIqX5E-AVSJrOCfjY46_DjQbMZhKg.woff2') format('woff2');
        }

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: #010101;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Josefin Sans', sans-serif;
          color: #F6F6F6;
          padding: 60px 40px;
        }

        .ambient-glow {
          position: absolute;
          width: 850px;
          height: 850px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(246, 0, 0, 0.2) 0%, rgba(246, 0, 0, 0.04) 45%, rgba(0, 0, 0, 0) 70%);
          pointer-events: none;
          z-index: 1;
        }

        /* Stylized Mobile Bento Grid Container */
        .bento-container {
          position: relative;
          z-index: 5;
          width: 980px;
          height: 1680px;
          background: #0D0F12;
          border: 2px solid rgba(255, 255, 255, 0.12);
          border-radius: 44px;
          padding: 40px;
          display: flex;
          flex-direction: column;
          box-shadow: 0 32px 80px rgba(0, 0, 0, 0.85), 0 0 50px rgba(246, 0, 0, 0.08);
          overflow: hidden;
        }

        /* Top Header */
        .bento-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding-bottom: 24px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.08);
          margin-bottom: 28px;
        }

        .bento-tag {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 10px 24px;
          border-radius: 999px;
          background: #F60000;
          color: #FFFFFF;
          font-size: 22px;
          font-weight: 800;
          letter-spacing: 0.08em;
          text-transform: uppercase;
        }

        .stopwatch-badge {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 10px 22px;
          border-radius: 999px;
          background: rgba(16, 185, 129, 0.12);
          border: 1px solid rgba(16, 185, 129, 0.35);
          color: #34D399;
          font-size: 20px;
          font-weight: 700;
        }

        /* Title */
        .scene-title {
          font-size: 42px;
          font-weight: 800;
          line-height: 1.15;
          letter-spacing: -0.01em;
          text-transform: uppercase;
          margin-bottom: 24px;
        }

        /* Chip Selection */
        .chips-row {
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
          margin-bottom: 28px;
        }

        .rubro-chip {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 14px 26px;
          border-radius: 999px;
          background: #181A20;
          border: 1.5px solid rgba(255, 255, 255, 0.12);
          font-size: 22px;
          font-weight: 700;
          color: #CCCCCC;
        }

        .rubro-chip.active {
          background: #F60000;
          border-color: #F60000;
          color: #FFFFFF;
          box-shadow: 0 4px 20px rgba(246, 0, 0, 0.5);
        }

        /* Pill Badge: Chau al síndrome de la pantalla en blanco */
        .chau-pantalla-pill {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 12px;
          padding: 14px 28px;
          border-radius: 999px;
          background: rgba(246, 0, 0, 0.12);
          border: 1.5px solid rgba(246, 0, 0, 0.4);
          color: #F60000;
          font-size: 20px;
          font-weight: 800;
          letter-spacing: 0.04em;
          text-align: center;
          margin-bottom: 28px;
        }

        /* 5 Category Cards */
        .categories-grid {
          display: flex;
          flex-direction: column;
          gap: 14px;
        }

        .category-card {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 20px 26px;
          background: #14171C;
          border: 1.5px solid rgba(255, 255, 255, 0.08);
          border-radius: 20px;
        }

        .cat-main {
          display: flex;
          align-items: center;
          gap: 18px;
        }

        .cat-icon {
          font-size: 32px;
          width: 52px;
          height: 52px;
          border-radius: 14px;
          background: rgba(255, 255, 255, 0.05);
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .cat-title {
          font-size: 24px;
          font-weight: 700;
          color: #FFFFFF;
        }

        .cat-desc {
          font-size: 18px;
          color: #9E9E9E;
          margin-top: 4px;
        }

        .cat-badge {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 8px 18px;
          border-radius: 999px;
          background: rgba(16, 185, 129, 0.14);
          color: #34D399;
          font-size: 17px;
          font-weight: 800;
        }

        /* Footer live note */
        .bento-footer {
          margin-top: auto;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 12px;
          padding: 16px 28px;
          border-radius: 20px;
          background: rgba(255, 255, 255, 0.04);
          border: 1px solid rgba(255, 255, 255, 0.1);
          color: #D1D5DB;
          font-size: 20px;
          font-weight: 700;
          text-transform: uppercase;
        }
      </style>

      <div id="root" data-composition-id="scene-3-tienda-rapida" data-width="1080" data-height="1920">
        <div class="ambient-glow" id="ambient-glow"></div>

        <div class="bento-container" id="bento-container">
          <div class="bento-header">
            <div class="bento-tag">2. TU TIENDA EN 5 MINUTOS</div>
            <div class="stopwatch-badge">⏱️ 05:00 MIN</div>
          </div>

          <h2 class="scene-title">CONFIGURACIÓN AUTOMÁTICA</h2>

          <!-- Chip selection simulation -->
          <div class="chips-row" id="chips-row">
            <div class="rubro-chip active" id="chip-gastro">ALMACÉN / GASTRONOMÍA ✓</div>
            <div class="rubro-chip">KIOSCO & SNACKS</div>
            <div class="rubro-chip">TIENDA & RETAIL</div>
          </div>

          <!-- Pill Badge Drops -->
          <div class="chau-pantalla-pill" id="chau-pantalla-pill">
            ⚡ CHAU AL SÍNDROME DE LA PANTALLA EN BLANCO
          </div>

          <!-- 5 Category Cards Cascading In -->
          <div class="categories-grid" id="categories-grid">
            <div class="category-card" id="cat-1">
              <div class="cat-main">
                <div class="cat-icon">🥤</div>
                <div>
                  <div class="cat-title">Bebidas & Cervezas</div>
                  <div class="cat-desc">45 productos con control de stock</div>
                </div>
              </div>
              <div class="cat-badge">LISTO ✓</div>
            </div>

            <div class="category-card" id="cat-2">
              <div class="cat-main">
                <div class="cat-icon">🥩</div>
                <div>
                  <div class="cat-title">Frescos & Carnes</div>
                  <div class="cat-desc">32 productos con peso y corte</div>
                </div>
              </div>
              <div class="cat-badge">LISTO ✓</div>
            </div>

            <div class="category-card" id="cat-3">
              <div class="cat-main">
                <div class="cat-icon">🥖</div>
                <div>
                  <div class="cat-title">Panadería & Confitería</div>
                  <div class="cat-desc">28 productos frescos listos</div>
                </div>
              </div>
              <div class="cat-badge">LISTO ✓</div>
            </div>

            <div class="category-card" id="cat-4">
              <div class="cat-main">
                <div class="cat-icon">🥫</div>
                <div>
                  <div class="cat-title">Despensa & Almacén</div>
                  <div class="cat-desc">60 productos precargados</div>
                </div>
              </div>
              <div class="cat-badge">LISTO ✓</div>
            </div>

            <div class="category-card" id="cat-5">
              <div class="cat-main">
                <div class="cat-icon">🧼</div>
                <div>
                  <div class="cat-title">Limpieza & Perfumería</div>
                  <div class="cat-desc">40 productos configurados</div>
                </div>
              </div>
              <div class="cat-badge">LISTO ✓</div>
            </div>
          </div>

          <div class="bento-footer">
            CATÁLOGO INTELIGENTE PRECARGADO PARA TU RUBRO
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Initial states
        gsap.set("#bento-container", { scale: 0.9, opacity: 0 });
        gsap.set(".rubro-chip", { opacity: 0, y: 20 });
        gsap.set("#chau-pantalla-pill", { scale: 0.85, opacity: 0 });
        gsap.set(".category-card", { opacity: 0, x: -30 });

        // 0.0s - 0.7s: Fast zoom into Bento Grid Container
        tl.fromTo("#bento-container",
          { scale: 0.88, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.4)" },
          0.05
        );

        tl.fromTo("#ambient-glow",
          { scale: 0.7, opacity: 0.2 },
          { scale: 1.15, opacity: 0.6, duration: 1.0, ease: "power2.out" },
          0.1
        );

        // Chip tap selection
        tl.fromTo(".rubro-chip",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, stagger: 0.08, duration: 0.35, ease: "power3.out" },
          0.35
        );

        tl.fromTo("#chip-gastro",
          { scale: 0.92 },
          { scale: 1.06, duration: 0.2, repeat: 1, yoyo: true, ease: "back.out(2)" },
          0.7
        );

        // Pill badge drops
        tl.fromTo("#chau-pantalla-pill",
          { scale: 0.85, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.8)" },
          1.0
        );

        // 5 Category cards cascade in with staggered spring physics
        tl.fromTo(".category-card",
          { opacity: 0, x: -30 },
          { opacity: 1, x: 0, stagger: 0.12, duration: 0.45, ease: "power3.out" },
          1.25
        );

        // 4.25s: Punchy Exit Snap
        tl.to("#bento-container", {
          scale: 1.08,
          opacity: 0,
          duration: 0.22,
          ease: "power2.in"
        }, 4.25);

        window.__timelines["scene-3-tienda-rapida"] = tl;
      </script>
    </template>
  </body>
</html>

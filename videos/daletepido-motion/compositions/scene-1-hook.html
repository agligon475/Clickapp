<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Josefin Sans';
          font-style: normal;
          font-weight: 400 700;
          src: local('Josefin Sans'), url('https://fonts.gstatic.com/s/josefinsans/v32/Qw3aZQNVED7rKGKxtqIqX5E-AVSJrOCfjY46_DjQbMZhKg.woff2') format('woff2');
        }

        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #010101;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Josefin Sans', sans-serif;
          color: #F6F6F6;
          padding: 80px 50px;
        }

        .ambient-glow-h {
          position: absolute;
          width: 850px;
          height: 850px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(246, 0, 0, 0.25) 0%, rgba(246, 0, 0, 0) 70%);
          pointer-events: none;
        }

        .hook-content {
          position: relative;
          z-index: 2;
          width: 960px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 24px;
        }

        .hook-pre-badge {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 14px 32px;
          border-radius: 999px;
          background: rgba(246, 0, 0, 0.12);
          border: 1.5px solid rgba(246, 0, 0, 0.4);
          font-size: 24px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #F60000;
        }

        .hook-pre-badge-dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background-color: #F60000;
          box-shadow: 0 0 14px #F60000;
        }

        .hook-headline {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 10px;
        }

        .hook-line {
          font-size: 88px;
          line-height: 1.05;
          font-weight: 700;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          color: #F6F6F6;
        }

        .hook-line-row {
          display: flex;
          align-items: center;
          gap: 14px;
        }

        .blinking-question {
          display: inline-block;
          font-size: 96px;
          font-weight: 700;
          color: #F60000;
          text-shadow: 0 0 30px rgba(246, 0, 0, 0.8);
        }

        .hook-alert-banner {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 16px;
          width: 100%;
          max-width: 880px;
          padding: 22px 36px;
          border-radius: 20px;
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.1);
          margin-top: 24px;
        }

        .alert-cross-text {
          font-size: 26px;
          font-weight: 600;
          color: #A1A1AA;
          text-decoration: line-through;
          text-decoration-color: #F60000;
          text-decoration-thickness: 3px;
        }

        .alert-pill {
          padding: 6px 18px;
          border-radius: 999px;
          background: #F60000;
          color: #FFFFFF;
          font-size: 20px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.05em;
        }
      </style>

      <div id="root" data-composition-id="scene-1-hook" data-width="1080" data-height="1920">
        <div id="hook-ambient" class="ambient-glow-h"></div>

        <div id="hook-wrap" class="hook-content">
          <div id="hook-badge" class="hook-pre-badge">
            <span class="hook-pre-badge-dot"></span>
            <span>Atención Dueños de Negocios</span>
          </div>

          <div class="hook-headline">
            <div id="h-line-1" class="hook-line">¿CANSADO DE</div>
            <div id="h-line-2" class="hook-line">REGALAR TU</div>
            <div id="h-line-3" class="hook-line hook-line-row">
              <span>GANANCIA</span>
              <span id="question-mark" class="blinking-question">?</span>
            </div>
          </div>

          <div id="hook-banner" class="hook-alert-banner">
            <span class="alert-pill">Apps de Envíos</span>
            <span class="alert-cross-text">Comisiones del 25% al 35% por venta</span>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Ambient glow breathing
        tl.fromTo(
          "#hook-ambient",
          { scale: 0.85, opacity: 0.5 },
          { scale: 1.25, opacity: 0.9, duration: 4.0, ease: "none" },
          0
        );

        // Pre-badge snap entry
        tl.fromTo(
          "#hook-badge",
          { opacity: 0, y: -40, scale: 0.88 },
          { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2)" },
          0.1
        );

        // Kinetic Text Snaps
        tl.fromTo(
          "#h-line-1",
          { opacity: 0, y: 70, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" },
          0.3
        );

        tl.fromTo(
          "#h-line-2",
          { opacity: 0, y: 70, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" },
          0.5
        );

        tl.fromTo(
          "#h-line-3",
          { opacity: 0, y: 70, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" },
          0.7
        );

        // Pulsing question mark impacts
        tl.fromTo(
          "#question-mark",
          { scale: 0.3, opacity: 0 },
          { scale: 1.35, opacity: 1, duration: 0.3, ease: "back.out(3)" },
          0.85
        );
        tl.to("#question-mark", { scale: 1.0, duration: 0.2, ease: "power2.out" }, 1.15);

        // Blinks at 1.8s, 2.4s, 3.0s
        tl.to("#question-mark", { opacity: 0.2, duration: 0.12 }, 1.8);
        tl.to("#question-mark", { opacity: 1.0, scale: 1.2, duration: 0.15 }, 1.95);
        tl.to("#question-mark", { scale: 1.0, duration: 0.15 }, 2.1);

        tl.to("#question-mark", { opacity: 0.2, duration: 0.12 }, 2.7);
        tl.to("#question-mark", { opacity: 1.0, scale: 1.25, duration: 0.15 }, 2.85);
        tl.to("#question-mark", { scale: 1.0, duration: 0.15 }, 3.0);

        // Banner entrance
        tl.fromTo(
          "#hook-banner",
          { opacity: 0, y: 50, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" },
          1.1
        );

        // Fast kinetic exit wipe into Scene 2 (3.7s - 4.0s)
        tl.to(
          "#hook-wrap",
          { opacity: 0, scale: 1.15, duration: 0.28, ease: "power2.in" },
          3.72
        );

        window.__timelines["scene-1-hook"] = tl;
      </script>
    </template>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Josefin Sans';
          font-style: normal;
          font-weight: 400 800;
          src: local('Josefin Sans'), url('https://fonts.gstatic.com/s/josefinsans/v32/Qw3aZQNVED7rKGKxtqIqX5E-AVSJrOCfjY46_DjQbMZhKg.woff2') format('woff2');
        }

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: #010101;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Josefin Sans', sans-serif;
          color: #F6F6F6;
          padding: 60px 40px;
        }

        /* Ambient Glow Effect */
        .ambient-glow {
          position: absolute;
          width: 900px;
          height: 900px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(246, 0, 0, 0.22) 0%, rgba(246, 0, 0, 0.05) 45%, rgba(0, 0, 0, 0) 70%);
          pointer-events: none;
          z-index: 1;
        }

        /* Part 1: Logo Presentation Container (0s - 2.5s) */
        .logo-section {
          position: absolute;
          z-index: 5;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          width: 100%;
          max-width: 960px;
        }

        .logo-svg-wrap {
          width: 640px;
          height: 280px;
          display: flex;
          align-items: center;
          justify-content: center;
          position: relative;
        }

        .logo-svg {
          width: 100%;
          height: 100%;
          overflow: visible;
        }

        .logo-subtitle {
          margin-top: 36px;
          font-size: 32px;
          font-weight: 700;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: #F6F6F6;
          padding: 12px 28px;
          background: rgba(255, 255, 255, 0.04);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 999px;
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        /* Part 2: Kinetic Problem Cut (2.5s - 3.4s) */
        .problem-section {
          position: absolute;
          z-index: 6;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          width: 960px;
          gap: 32px;
          opacity: 0;
          visibility: hidden;
        }

        .problem-badge {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 12px 28px;
          border-radius: 999px;
          background: rgba(246, 0, 0, 0.15);
          border: 1.5px solid rgba(246, 0, 0, 0.45);
          color: #F60000;
          font-size: 22px;
          font-weight: 700;
          letter-spacing: 0.1em;
          text-transform: uppercase;
        }

        .problem-title {
          font-size: 86px;
          line-height: 1.08;
          font-weight: 800;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          color: #F6F6F6;
        }

        .highlight-red {
          color: #F60000;
          display: inline-block;
          text-shadow: 0 0 40px rgba(246, 0, 0, 0.6);
        }

        .commission-pill {
          display: inline-flex;
          align-items: center;
          gap: 16px;
          padding: 16px 36px;
          background: #121212;
          border: 2px solid rgba(246, 0, 0, 0.4);
          border-radius: 24px;
          font-size: 32px;
          font-weight: 700;
          color: #FFFFFF;
        }

        /* Part 3: Kinetic Solution Proposition (3.4s - 4.5s) */
        .solution-section {
          position: absolute;
          z-index: 7;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          width: 960px;
          gap: 28px;
          opacity: 0;
          visibility: hidden;
        }

        .hero-zero-box {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
        }

        .hero-zero-number {
          font-size: 160px;
          line-height: 0.9;
          font-weight: 800;
          color: #F60000;
          letter-spacing: -0.04em;
          text-shadow: 0 0 60px rgba(246, 0, 0, 0.7);
        }

        .hero-zero-label {
          font-size: 48px;
          font-weight: 800;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #F60000;
        }

        .solution-features-bar {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 16px;
          width: 100%;
        }

        .feature-item {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 16px;
          width: 100%;
          max-width: 860px;
          padding: 20px 32px;
          background: #0E0E0E;
          border: 1.5px solid rgba(255, 255, 255, 0.12);
          border-radius: 20px;
          font-size: 34px;
          font-weight: 700;
          color: #F6F6F6;
          letter-spacing: 0.02em;
        }

        .feature-item.accent {
          background: rgba(16, 185, 129, 0.1);
          border-color: rgba(16, 185, 129, 0.4);
          color: #34D399;
        }

        .check-badge {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 38px;
          height: 38px;
          border-radius: 50%;
          background: #10B981;
          color: #010101;
          font-weight: 800;
          font-size: 22px;
        }
      </style>

      <div id="root" data-composition-id="scene-1-hook" data-width="1080" data-height="1920">
        <div class="ambient-glow" id="ambient-glow"></div>

        <!-- Part 1: Official Dale!TePido Logo Entrance -->
        <div class="logo-section" id="logo-section">
          <div class="logo-svg-wrap" id="logo-svg-wrap">
            <svg class="logo-svg" viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg">
              <!-- Dale! Top Line -->
              <text x="300" y="88" text-anchor="middle" font-family="'Josefin Sans', sans-serif" font-weight="800" font-size="86" fill="#F6F6F6" letter-spacing="8">DALE!</text>
              
              <!-- TEPIDO Bottom Line -->
              <text x="135" y="194" font-family="'Josefin Sans', sans-serif" font-weight="800" font-size="86" fill="#F6F6F6" letter-spacing="8">TEP</text>
              <text x="312" y="194" font-family="'Josefin Sans', sans-serif" font-weight="800" font-size="86" fill="#F6F6F6">I</text>
              <text x="354" y="194" font-family="'Josefin Sans', sans-serif" font-weight="800" font-size="86" fill="#F6F6F6" letter-spacing="8">D</text>
              <text x="432" y="194" font-family="'Josefin Sans', sans-serif" font-weight="800" font-size="86" fill="#F6F6F6">O</text>
              
              <!-- Letter 'i' Crisp Dot -->
              <circle id="logo-i-dot" cx="316" cy="130" r="6" fill="#F60000" />
              
              <!-- Smooth Curved Hairline Arc from 'i' dot to over 'O' -->
              <path id="logo-arc-path" d="M 316 128 C 348 76, 422 76, 458 126" fill="none" stroke="#F6F6F6" stroke-width="3.5" stroke-linecap="round" />
              
              <!-- Red Arrowhead pointing down over 'O' -->
              <path id="logo-arrowhead" d="M 458 136 L 449 122 L 467 122 Z" fill="#F60000" />
            </svg>
          </div>
          <div class="logo-subtitle" id="logo-subtitle">EL CATÁLOGO DIGITAL PARA TU COMERCIO</div>
        </div>

        <!-- Part 2: Kinetic Problem Cut (2.5s) -->
        <div class="problem-section" id="problem-section">
          <div class="problem-badge">● ALERTA COMISIONES</div>
          <h1 class="problem-title">
            ¿CANSADO DE REGALAR HASTA EL <span class="highlight-red">30%</span> EN COMISIONES<span class="highlight-red" id="prob-q">?</span>
          </h1>
          <div class="commission-pill">
            <span style="color: #94A3B8;">Otras apps:</span>
            <span style="color: #EF4444; font-weight: 800;">-25% a -35% de tus ventas</span>
          </div>
        </div>

        <!-- Part 3: Solution Proposition (3.4s) -->
        <div class="solution-section" id="solution-section">
          <div class="hero-zero-box">
            <div class="hero-zero-number">0%</div>
            <div class="hero-zero-label">COMISIONES POR VENTA</div>
          </div>
          <div class="solution-features-bar">
            <div class="feature-item">
              <span class="check-badge">✓</span>
              <span>SIN CHECKOUT COMPLEJO</span>
            </div>
            <div class="feature-item accent">
              <span class="check-badge" style="background: #10B981; color: #010101;">✓</span>
              <span>100% DE LA GANANCIA EN TU CAJA</span>
            </div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Arc stroke setup
        const arcLength = 200;
        gsap.set("#logo-arc-path", { strokeDasharray: arcLength, strokeDashoffset: arcLength });
        gsap.set("#logo-svg-wrap", { transformOrigin: "center center" });
        gsap.set("#logo-arrowhead", { transformOrigin: "center center" });

        // Initial states
        gsap.set("#logo-section", { autoAlpha: 1, scale: 1 });
        gsap.set("#problem-section", { autoAlpha: 0, scale: 0.85 });
        gsap.set("#solution-section", { autoAlpha: 0, scale: 0.85 });

        // 0.0s - 1.2s: Logo Entrance with Spring Scale & Arc Draw
        tl.fromTo("#logo-svg-wrap", 
          { scale: 0.78, opacity: 0 }, 
          { scale: 1, opacity: 1, duration: 0.8, ease: "back.out(1.8)" }, 
          0.05
        );

        tl.fromTo("#ambient-glow", 
          { scale: 0.6, opacity: 0.3 }, 
          { scale: 1.1, opacity: 0.8, duration: 1.2, ease: "power2.out" }, 
          0.1
        );

        tl.fromTo("#logo-i-dot",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" },
          0.3
        );

        // Signature curved hairline arc springs from 'i' to 'O'
        tl.fromTo("#logo-arc-path",
          { strokeDashoffset: arcLength },
          { strokeDashoffset: 0, duration: 0.75, ease: "power2.out" },
          0.4
        );

        // Red Arrowhead pops in at 'O'
        tl.fromTo("#logo-arrowhead",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.5)" },
          0.95
        );

        // Subtitle slides up
        tl.fromTo("#logo-subtitle",
          { y: 30, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
          1.1
        );

        // 2.25s - 2.5s: Logo Exit Punch
        tl.to("#logo-section", {
          scale: 1.12,
          autoAlpha: 0,
          duration: 0.22,
          ease: "power2.in"
        }, 2.25);

        // 2.5s - 3.4s: Kinetic Problem Cut
        tl.fromTo("#problem-section",
          { scale: 0.82, autoAlpha: 0 },
          { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(1.6)" },
          2.5
        );

        // Blinking question mark
        tl.to("#prob-q", { color: "#FFFFFF", duration: 0.15, repeat: 2, yoyo: true }, 2.7);

        // 3.3s: Problem Exit
        tl.to("#problem-section", {
          scale: 0.9,
          autoAlpha: 0,
          duration: 0.15,
          ease: "power2.in"
        }, 3.3);

        // 3.4s - 4.5s: Kinetic Solution Proposition (0% Comisiones)
        tl.fromTo("#solution-section",
          { scale: 0.8, autoAlpha: 0 },
          { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(1.8)" },
          3.42
        );

        tl.fromTo(".hero-zero-box",
          { scale: 0.75, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.2)" },
          3.45
        );

        tl.fromTo(".feature-item",
          { y: 40, opacity: 0 },
          { y: 0, opacity: 1, stagger: 0.14, duration: 0.35, ease: "power3.out" },
          3.65
        );

        // Punchy zoom-in exit towards Scene 2 at 4.32s - 4.5s
        tl.to("#solution-section", {
          scale: 1.08,
          autoAlpha: 0,
          duration: 0.18,
          ease: "power2.in"
        }, 4.32);

        window.__timelines["scene-1-hook"] = tl;
      </script>
    </template>
  </body>
</html>

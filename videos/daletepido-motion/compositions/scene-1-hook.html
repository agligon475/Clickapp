<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Josefin Sans';
          font-style: normal;
          font-weight: 400 800;
          src: local('Josefin Sans'), url('https://fonts.gstatic.com/s/josefinsans/v32/Qw3aZQNVED7rKGKxtqIqX5E-AVSJrOCfjY46_DjQbMZhKg.woff2') format('woff2');
        }

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: #010101;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Josefin Sans', sans-serif;
          color: #F6F6F6;
          padding: 60px 48px;
        }

        .ambient-glow {
          position: absolute;
          width: 950px;
          height: 950px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(246, 0, 0, 0.25) 0%, rgba(246, 0, 0, 0.05) 45%, rgba(0, 0, 0, 0) 70%);
          pointer-events: none;
          z-index: 1;
        }

        /* 0.0s - 2.0s: Official Vector Logo Reveal */
        .logo-wrap {
          position: absolute;
          z-index: 5;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          width: 100%;
          max-width: 960px;
          opacity: 0;
          visibility: hidden;
        }

        .logo-box {
          width: 720px;
          height: 296px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .logo-img {
          width: 100%;
          height: 100%;
          object-fit: contain;
          display: block;
        }

        .logo-badge {
          margin-top: 36px;
          font-size: 26px;
          font-weight: 700;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: #F6F6F6;
          padding: 12px 36px;
          background: rgba(255, 255, 255, 0.04);
          border: 1.5px solid rgba(255, 255, 255, 0.14);
          border-radius: 999px;
        }

        /* 2.0s - 4.5s: Kinetic Typography Entrance */
        .hook-text-wrap {
          position: absolute;
          z-index: 6;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          width: 960px;
          gap: 36px;
          opacity: 0;
          visibility: hidden;
        }

        .hook-badge {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 12px 30px;
          border-radius: 999px;
          background: rgba(246, 0, 0, 0.14);
          border: 1.5px solid rgba(246, 0, 0, 0.5);
          color: #F60000;
          font-size: 22px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
        }

        .hook-headline {
          font-size: 92px;
          line-height: 1.04;
          font-weight: 800;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          color: #F6F6F6;
        }

        .hook-q-mark {
          color: #F60000;
          display: inline-block;
          text-shadow: 0 0 50px rgba(246, 0, 0, 0.85);
        }

        .hook-subtitle-card {
          width: 100%;
          padding: 24px 36px;
          background: #0D0F12;
          border: 2px solid rgba(246, 0, 0, 0.45);
          border-radius: 28px;
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(246, 0, 0, 0.15);
        }

        .hook-subtitle {
          font-size: 32px;
          font-weight: 800;
          letter-spacing: 0.05em;
          text-transform: uppercase;
          color: #FFFFFF;
        }

        .hook-metric-pill {
          display: inline-flex;
          align-items: center;
          gap: 14px;
          padding: 10px 28px;
          background: rgba(255, 255, 255, 0.06);
          border: 1px solid rgba(255, 255, 255, 0.15);
          border-radius: 999px;
          color: #10B981;
          font-size: 22px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          margin-top: 10px;
        }
      </style>

      <div id="root" data-composition-id="scene-1-hook" data-width="1080" data-height="1920">
        <div class="ambient-glow" id="ambient-glow"></div>

        <!-- 0.0s - 2.0s: Official Logo Reveal -->
        <div class="logo-wrap" id="logo-wrap">
          <div class="logo-box">
            <img src="./assets/logo-dtp-vector-04.svg" class="logo-img" alt="Dale!TePido" id="logo-img-01" />
          </div>
          <div class="logo-badge">CATÁLOGO DIGITAL SIN INTERMEDIARIOS</div>
        </div>

        <!-- 2.0s - 4.5s: Kinetic Typography Entrance -->
        <div class="hook-text-wrap" id="hook-text-wrap">
          <div class="hook-badge">● EL PROBLEMA DE LAS APPS</div>
          <h1 class="hook-headline">
            ¿CANSADO DE REGALAR TU GANANCIA<span class="hook-q-mark" id="hook-q-mark">?</span>
          </h1>
          <div class="hook-subtitle-card">
            <div class="hook-subtitle">TU CATÁLOGO DIGITAL SIN INTERMEDIARIOS</div>
            <div class="hook-metric-pill">0% COMISIONES · 100% EN TU CAJA</div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Initial setup
        gsap.set("#logo-wrap", { autoAlpha: 0, scale: 0.8, transformOrigin: "center center" });
        gsap.set("#hook-text-wrap", { autoAlpha: 0, scale: 0.88, transformOrigin: "center center" });

        // 0.0s - 2.0s: Logo scale-in with spring pop
        tl.to("#logo-wrap", {
          autoAlpha: 1,
          scale: 1.0,
          duration: 0.85,
          ease: "back.out(2)"
        }, 0.1);

        tl.fromTo("#ambient-glow",
          { scale: 0.65, opacity: 0.2 },
          { scale: 1.15, opacity: 0.85, duration: 1.2, ease: "power2.out" },
          0.1
        );

        // 1.8s: Logo transition out
        tl.to("#logo-wrap", {
          autoAlpha: 0,
          scale: 1.06,
          duration: 0.25,
          ease: "power2.in"
        }, 1.8);

        // 2.0s - 4.5s: Kinetic typography reveal
        tl.to("#hook-text-wrap", {
          autoAlpha: 1,
          scale: 1.0,
          duration: 0.55,
          ease: "back.out(1.8)"
        }, 2.0);

        // Pulsing red ?
        tl.fromTo("#hook-q-mark",
          { scale: 1 },
          { scale: 1.25, duration: 0.35, yoyo: true, repeat: 3, ease: "power1.inOut" },
          2.3
        );

        // Exit transition to light theme
        tl.to("#hook-text-wrap", {
          scale: 0.94,
          opacity: 0.2,
          duration: 0.25,
          ease: "power2.in"
        }, 4.25);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene-1-hook"] = tl;
      </script>
    </template>
  </body>
</html>

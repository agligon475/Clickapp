<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Josefin Sans';
          font-style: normal;
          font-weight: 400 700;
          src: local('Josefin Sans'), url('https://fonts.gstatic.com/s/josefinsans/v32/Qw3aZQNVED7rKGKxtqIqX5E-AVSJrOCfjY46_DjQbMZhKg.woff2') format('woff2');
        }

        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #010101;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Josefin Sans', sans-serif;
          color: #FFFFFF;
        }

        .ambient-glow-hook {
          position: absolute;
          width: 800px;
          height: 800px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(246, 0, 0, 0.22) 0%, rgba(246, 0, 0, 0) 70%);
          pointer-events: none;
        }

        .hook-container {
          position: relative;
          z-index: 2;
          width: 960px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        }

        /* Phase 1 */
        .hook-phase-1 {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
        }

        .hook-badge {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 12px 28px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.06);
          border: 1px solid rgba(255, 255, 255, 0.14);
          font-size: 24px;
          font-weight: 600;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #E2E8F0;
          margin-bottom: 24px;
        }

        .hook-badge-dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background-color: #F60000;
          box-shadow: 0 0 14px #F60000;
        }

        .hook-line {
          font-size: 82px;
          line-height: 1.05;
          font-weight: 700;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          color: #FFFFFF;
        }

        .hook-line-question {
          color: #F60000;
        }

        /* Phase 2 */
        .hook-phase-2 {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 24px;
        }

        .hook-p2-pre {
          font-size: 58px;
          font-weight: 600;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: #D1D5DB;
        }

        .hook-p2-hero {
          display: inline-block;
          padding: 18px 52px;
          background: #F60000;
          color: #FFFFFF;
          font-size: 96px;
          font-weight: 700;
          letter-spacing: -0.01em;
          border-radius: 28px;
          box-shadow: 0 16px 50px rgba(246, 0, 0, 0.5);
          text-transform: uppercase;
        }

        .hook-p2-post {
          font-size: 56px;
          font-weight: 700;
          letter-spacing: -0.01em;
          text-transform: uppercase;
          color: #FFFFFF;
        }

        .hook-brand-accent {
          color: #F60000;
        }
      </style>

      <div id="root" data-composition-id="scene-hook" data-width="1080" data-height="1920">
        <div id="hook-ambient" class="ambient-glow-hook"></div>

        <div class="hook-container">
          <!-- Hook Phase 1 (0.0s - 2.5s) -->
          <div id="hook-p1" class="hook-phase-1">
            <div id="hook-badge" class="hook-badge">
              <span class="hook-badge-dot"></span>
              <span>Comercios & Negocios</span>
            </div>
            <div id="hook-line-1" class="hook-line hook-line-question">¿SEMANAS</div>
            <div id="hook-line-2" class="hook-line">PARA DIGITALIZAR</div>
            <div id="hook-line-3" class="hook-line">TU TIENDA?</div>
          </div>

          <!-- Hook Phase 2 (2.5s - 4.0s) -->
          <div id="hook-p2" class="hook-phase-2">
            <div id="hook-p2-pre" class="hook-p2-pre">HACELO EN</div>
            <div id="hook-p2-hero" class="hook-p2-hero">5 MINUTOS</div>
            <div id="hook-p2-post" class="hook-p2-post">
              CON <span class="hook-brand-accent">DALE!TEPIDO</span>
            </div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Ambient glow subtle float
        tl.fromTo(
          "#hook-ambient",
          { x: 0, y: -50, scale: 0.9, opacity: 0.6 },
          { x: 30, y: 50, scale: 1.15, opacity: 0.9, duration: 4.0, ease: "none" },
          0
        );

        // Badge entry with spring
        tl.fromTo(
          "#hook-badge",
          { opacity: 0, y: -40, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.7)" },
          0.15
        );

        // Staggered crisp slide-up for questions
        tl.fromTo(
          "#hook-line-1",
          { opacity: 0, y: 70 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          0.35
        );

        tl.fromTo(
          "#hook-line-2",
          { opacity: 0, y: 70 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          0.55
        );

        tl.fromTo(
          "#hook-line-3",
          { opacity: 0, y: 70 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          0.75
        );

        // Phase 1 exit (2.2s - 2.5s)
        tl.fromTo(
          "#hook-p1",
          { opacity: 1, y: 0, scale: 1 },
          { opacity: 0, y: -80, scale: 0.95, duration: 0.35, ease: "power2.in" },
          2.2
        );

        // Phase 2 entry at 2.5s
        tl.fromTo(
          "#hook-p2",
          { opacity: 0, y: 90, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" },
          2.5
        );

        // Highlight "5 MINUTOS" pop
        tl.fromTo(
          "#hook-p2-hero",
          { scale: 0.84 },
          { scale: 1.05, duration: 0.35, ease: "back.out(2)" },
          2.65
        );
        tl.to(
          "#hook-p2-hero",
          { scale: 1.0, duration: 0.25, ease: "power2.out" },
          3.0
        );

        // Outro transition at 3.7s
        tl.to(
          "#hook-p2",
          { opacity: 0, scale: 1.1, duration: 0.3, ease: "power2.in" },
          3.7
        );

        window.__timelines["scene-hook"] = tl;
      </script>
    </template>
  </body>
</html>

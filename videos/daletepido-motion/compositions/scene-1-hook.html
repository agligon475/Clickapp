<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Josefin Sans';
          font-style: normal;
          font-weight: 400 800;
          src: local('Josefin Sans'), url('https://fonts.gstatic.com/s/josefinsans/v32/Qw3aZQNVED7rKGKxtqIqX5E-AVSJrOCfjY46_DjQbMZhKg.woff2') format('woff2');
        }

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: #010101;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Josefin Sans', sans-serif;
          color: #F6F6F6;
          padding: 60px 40px;
        }

        .ambient-glow {
          position: absolute;
          width: 900px;
          height: 900px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(246, 0, 0, 0.22) 0%, rgba(246, 0, 0, 0.04) 45%, rgba(0, 0, 0, 0) 70%);
          pointer-events: none;
          z-index: 1;
        }

        /* Part 1: Official Logo Container (0s - 2.0s) */
        .logo-wrap {
          position: absolute;
          z-index: 5;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          width: 100%;
          max-width: 960px;
        }

        .logo-svg-box {
          width: 680px;
          height: 270px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .logo-svg {
          width: 100%;
          height: 100%;
          overflow: visible;
        }

        .logo-sub-pill {
          margin-top: 36px;
          font-size: 26px;
          font-weight: 700;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: #F6F6F6;
          padding: 12px 32px;
          background: rgba(255, 255, 255, 0.04);
          border: 1.5px solid rgba(255, 255, 255, 0.12);
          border-radius: 999px;
        }

        /* Part 2: Kinetic Headline Wipe (2.0s - 4.5s) */
        .hook-text-wrap {
          position: absolute;
          z-index: 6;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          width: 960px;
          gap: 32px;
          opacity: 0;
          visibility: hidden;
        }

        .hook-badge {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 12px 28px;
          border-radius: 999px;
          background: rgba(246, 0, 0, 0.14);
          border: 1.5px solid rgba(246, 0, 0, 0.45);
          color: #F60000;
          font-size: 22px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
        }

        .hook-title {
          font-size: 88px;
          line-height: 1.06;
          font-weight: 800;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          color: #F6F6F6;
        }

        .hook-q-mark {
          color: #F60000;
          display: inline-block;
          text-shadow: 0 0 50px rgba(246, 0, 0, 0.8);
        }

        .hook-sub-pill {
          display: inline-flex;
          align-items: center;
          gap: 16px;
          padding: 18px 36px;
          background: #0D0F12;
          border: 1.5px solid rgba(246, 0, 0, 0.4);
          border-radius: 24px;
          font-size: 30px;
          font-weight: 800;
          color: #FFFFFF;
          letter-spacing: 0.04em;
          text-transform: uppercase;
        }
      </style>

      <div id="root" data-composition-id="scene-1-hook" data-width="1080" data-height="1920">
        <div class="ambient-glow" id="ambient-glow"></div>

        <!-- Part 1: Official Dale!TePido Logo -->
        <div class="logo-wrap" id="logo-wrap">
          <div class="logo-svg-box" id="logo-svg-box">
            <svg class="logo-svg" viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg">
              <!-- DALE! Top Line -->
              <text x="300" y="85" text-anchor="middle" font-family="'Josefin Sans', sans-serif" font-weight="800" font-size="84" fill="#F6F6F6" letter-spacing="8">DALE!</text>
              
              <!-- TEP i D O Bottom Line -->
              <!-- TEP -->
              <text x="135" y="192" font-family="'Josefin Sans', sans-serif" font-weight="800" font-size="84" fill="#F6F6F6" letter-spacing="8">TEP</text>
              <!-- Lengthened horizontal lower stem of P -->
              <rect x="278" y="185" width="22" height="7" fill="#F6F6F6" rx="2" />
              
              <!-- Lowercase 'i' stem -->
              <text x="312" y="192" font-family="'Josefin Sans', sans-serif" font-weight="800" font-size="84" fill="#F6F6F6">i</text>
              
              <!-- Solid white dot of the 'i' -->
              <circle id="logo-i-dot" cx="320" cy="128" r="6.5" fill="#F6F6F6" />
              
              <!-- D O -->
              <text x="354" y="192" font-family="'Josefin Sans', sans-serif" font-weight="800" font-size="84" fill="#F6F6F6" letter-spacing="8">D</text>
              <text x="432" y="192" font-family="'Josefin Sans', sans-serif" font-weight="800" font-size="84" fill="#F6F6F6">O</text>
              
              <!-- Distinctive Red Curved Accent Hairline Arc from 'i' dot to over 'O' -->
              <path id="logo-arc-path" d="M 320 126 C 352 74, 424 74, 460 124" fill="none" stroke="#F60000" stroke-width="4" stroke-linecap="round" />
              
              <!-- Downward Red Arrowhead pointing directly over the letter 'O' -->
              <path id="logo-arrowhead" d="M 460 134 L 451 119 L 469 119 Z" fill="#F60000" />
            </svg>
          </div>
          <div class="logo-sub-pill" id="logo-sub-pill">TU CATÁLOGO DIGITAL SIN INTERMEDIARIOS</div>
        </div>

        <!-- Part 2: Kinetic Headline Wipe -->
        <div class="hook-text-wrap" id="hook-text-wrap">
          <div class="hook-badge">● EL PROBLEMA DE LAS APPS</div>
          <h1 class="hook-title">
            ¿CANSADO DE REGALAR TU GANANCIA<span class="hook-q-mark" id="hook-q-mark">?</span>
          </h1>
          <div class="hook-sub-pill">
            TU CATÁLOGO DIGITAL SIN INTERMEDIARIOS
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Arc setup
        const arcLength = 190;
        gsap.set("#logo-arc-path", { strokeDasharray: arcLength, strokeDashoffset: arcLength });
        gsap.set("#logo-svg-box", { transformOrigin: "center center" });
        gsap.set("#logo-arrowhead", { transformOrigin: "center center" });

        // Initial states
        gsap.set("#logo-wrap", { autoAlpha: 1, scale: 1 });
        gsap.set("#hook-text-wrap", { autoAlpha: 0, scale: 0.85 });

        // 0.0s - 1.8s: Logo Entrance with Spring Pop & Dynamic Arc
        tl.fromTo("#logo-svg-box", 
          { scale: 0.76, opacity: 0 }, 
          { scale: 1, opacity: 1, duration: 0.75, ease: "back.out(2)" }, 
          0.05
        );

        tl.fromTo("#ambient-glow", 
          { scale: 0.6, opacity: 0.25 }, 
          { scale: 1.15, opacity: 0.8, duration: 1.2, ease: "power2.out" }, 
          0.1
        );

        tl.fromTo("#logo-i-dot",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" },
          0.25
        );

        // Red arc springs across from 'i' to 'O'
        tl.fromTo("#logo-arc-path",
          { strokeDashoffset: arcLength },
          { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" },
          0.35
        );

        // Downward red arrowhead pops in
        tl.fromTo("#logo-arrowhead",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.5)" },
          0.85
        );

        tl.fromTo("#logo-sub-pill",
          { y: 30, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
          1.0
        );

        // 1.85s - 2.0s: Transition from Logo to Kinetic Hook
        tl.to("#logo-wrap", {
          scale: 1.1,
          autoAlpha: 0,
          duration: 0.2,
          ease: "power2.in"
        }, 1.85);

        // 2.0s - 4.5s: Kinetic Typography Wipe
        tl.fromTo("#hook-text-wrap",
          { scale: 0.82, autoAlpha: 0 },
          { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(1.8)" },
          2.0
        );

        // Flashing red question mark
        tl.to("#hook-q-mark", { color: "#FFFFFF", duration: 0.16, repeat: 3, yoyo: true }, 2.3);

        // Punchy scale exit at 4.25s
        tl.to("#hook-text-wrap", {
          scale: 1.08,
          autoAlpha: 0,
          duration: 0.22,
          ease: "power2.in"
        }, 4.25);

        window.__timelines["scene-1-hook"] = tl;
      </script>
    </template>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Josefin Sans';
          font-style: normal;
          font-weight: 400 800;
          src: local('Josefin Sans'), url('https://fonts.gstatic.com/s/josefinsans/v32/Qw3aZQNVED7rKGKxtqIqX5E-AVSJrOCfjY46_DjQbMZhKg.woff2') format('woff2');
        }

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: #010101;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Josefin Sans', sans-serif;
          color: #F6F6F6;
          padding: 60px 48px;
        }

        .ambient-glow {
          position: absolute;
          width: 950px;
          height: 950px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(246, 0, 0, 0.24) 0%, rgba(246, 0, 0, 0.05) 45%, rgba(0, 0, 0, 0) 70%);
          pointer-events: none;
          z-index: 1;
        }

        /* Scene 1 - Step 1: Official Logo Entrance (0.0s - 1.5s) */
        .logo-wrap {
          position: absolute;
          z-index: 5;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          width: 100%;
          max-width: 960px;
          opacity: 0;
          visibility: hidden;
        }

        .logo-vector-box {
          width: 720px;
          height: 296px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .logo-vector-img {
          width: 100%;
          height: 100%;
          object-fit: contain;
          display: block;
        }

        .logo-sub-tag {
          margin-top: 32px;
          font-size: 26px;
          font-weight: 700;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: #F6F6F6;
          padding: 12px 36px;
          background: rgba(255, 255, 255, 0.04);
          border: 1.5px solid rgba(255, 255, 255, 0.14);
          border-radius: 999px;
        }

        /* Scene 1 - Step 2: Kinetic Text Cut (1.5s - 4.5s) */
        .hook-cut-wrap {
          position: absolute;
          z-index: 6;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          width: 960px;
          gap: 36px;
          opacity: 0;
          visibility: hidden;
        }

        .hook-badge {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 12px 30px;
          border-radius: 999px;
          background: rgba(246, 0, 0, 0.14);
          border: 1.5px solid rgba(246, 0, 0, 0.5);
          color: #F60000;
          font-size: 22px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
        }

        .hook-headline {
          font-size: 86px;
          line-height: 1.05;
          font-weight: 800;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          color: #F6F6F6;
        }

        .commission-cut {
          color: #F60000;
          text-decoration: line-through;
          text-decoration-thickness: 6px;
          display: inline-block;
          text-shadow: 0 0 35px rgba(246, 0, 0, 0.6);
        }

        .punchline-card {
          width: 100%;
          padding: 26px 36px;
          background: #0D0F12;
          border: 2px solid rgba(246, 0, 0, 0.45);
          border-radius: 28px;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(246, 0, 0, 0.12);
        }

        .punchline-text {
          font-size: 32px;
          font-weight: 800;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: #F6F6F6;
          line-height: 1.3;
        }

        .highlight-zero {
          color: #F60000;
          display: inline-block;
          background: rgba(246, 0, 0, 0.12);
          padding: 4px 14px;
          border-radius: 12px;
          border: 1px solid rgba(246, 0, 0, 0.35);
        }
      </style>

      <div id="root" data-composition-id="scene-1-hook" data-width="1080" data-height="1920">
        <div class="ambient-glow" id="ambient-glow"></div>

        <!-- Step 1: Official Logo Vector Asset Entrance -->
        <div class="logo-wrap" id="logo-wrap">
          <div class="logo-vector-box" id="logo-vector-box">
            <img src="./assets/logo-dtp-vector-04.svg" class="logo-vector-img" alt="Dale!TePido" id="logo-img" />
          </div>
          <div class="logo-sub-tag" id="logo-sub-tag">TU CATÁLOGO DIGITAL SIN INTERMEDIARIOS</div>
        </div>

        <!-- Step 2: Kinetic Text Cut -->
        <div class="hook-cut-wrap" id="hook-cut-wrap">
          <div class="hook-badge">● EL PROBLEMA DE LAS APPS</div>
          <h1 class="hook-headline">
            ¿CANSADO DE REGALAR HASTA EL <span class="commission-cut">30%</span> EN COMISIONES?
          </h1>
          <div class="punchline-card">
            <div class="punchline-text">
              <span class="highlight-zero">0% COMISIONES</span> · SIN CHECKOUT COMPLEJO · 100% EN TU CAJA
            </div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Initial setup
        gsap.set("#logo-wrap", { autoAlpha: 0, scale: 0.85, transformOrigin: "center center" });
        gsap.set("#hook-cut-wrap", { autoAlpha: 0, scale: 0.88, transformOrigin: "center center" });

        // 0.0s - 1.5s: Official Vector Logo Smooth Spring Scale Animation
        tl.to("#logo-wrap", {
          autoAlpha: 1,
          scale: 1.0,
          duration: 0.8,
          ease: "back.out(1.8)"
        }, 0.1);

        tl.fromTo("#ambient-glow", 
          { scale: 0.65, opacity: 0.2 }, 
          { scale: 1.15, opacity: 0.85, duration: 1.2, ease: "power2.out" }, 
          0.1
        );

        // 1.5s: Logo transition cut out
        tl.to("#logo-wrap", {
          autoAlpha: 0,
          scale: 1.08,
          duration: 0.25,
          ease: "power2.in"
        }, 1.45);

        // 1.5s - 4.5s: Kinetic Text Cut & Punchline Wipe
        tl.to("#hook-cut-wrap", {
          autoAlpha: 1,
          scale: 1.0,
          duration: 0.5,
          ease: "back.out(2)"
        }, 1.55);

        // Subtile pulse on 30% cut and badge
        tl.fromTo(".commission-cut", 
          { scale: 1 }, 
          { scale: 1.12, duration: 0.28, yoyo: true, repeat: 3, ease: "power1.inOut" }, 
          2.0
        );

        tl.fromTo(".punchline-card", 
          { y: 30, opacity: 0 }, 
          { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 
          2.2
        );

        // Smooth exit preparing for Light Theme wipe
        tl.to("#hook-cut-wrap", {
          scale: 0.94,
          opacity: 0.2,
          duration: 0.3,
          ease: "power2.in"
        }, 4.2);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene-1-hook"] = tl;
      </script>
    </template>
  </body>
</html>

        }

          display: inline-flex;

      <script>
        const tl = gsap.timeline({ paused: true });

        // Background pulse
        tl.fromTo(
          "#ambient-o",
          { scale: 0.9, opacity: 0.6 },
          { scale: 1.3, opacity: 0.95, duration: 2.0, ease: "none" },
          0
        );

        // Brand logo snaps in
        tl.fromTo(
          "#o-brand",
          { opacity: 0, y: -40, scale: 0.88 },
          { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2)" },
          0.05
        );

        // Huge headline punch
        tl.fromTo(
          "#o-headline",
          { opacity: 0, scale: 0.85, y: 30 },
          { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(2)" },
          0.2
        );

        // CTA Button Pop with massive spring impact
        tl.fromTo(
          "#o-btn",
          { opacity: 0, scale: 0.75, y: 40 },
          { opacity: 1, scale: 1.05, y: 0, duration: 0.35, ease: "back.out(2.5)" },
          0.45
        );
        tl.to("#o-btn", { scale: 1.0, duration: 0.2, ease: "power2.out" }, 0.82);

        // Trust badges stagger in
        tl.fromTo(
          ".outro-pill-chip",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.3, stagger: 0.08, ease: "power2.out" },
          0.8
        );

        // Hold steady until frame 900 (2.0s)
        tl.to("#outro-wrap", { y: -4, duration: 0.8, ease: "sine.inOut" }, 1.2);

        window.__timelines["scene-7-outro"] = tl;
      </script>

<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Josefin Sans';
          font-style: normal;
          font-weight: 400 800;
          src: local('Josefin Sans'), url('https://fonts.gstatic.com/s/josefinsans/v32/Qw3aZQNVED7rKGKxtqIqX5E-AVSJrOCfjY46_DjQbMZhKg.woff2') format('woff2');
        }

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: #010101;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Josefin Sans', sans-serif;
          color: #F6F6F6;
          padding: 60px 40px;
        }

        .ambient-glow {
          position: absolute;
          width: 950px;
          height: 950px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(246, 0, 0, 0.26) 0%, rgba(246, 0, 0, 0.05) 45%, rgba(0, 0, 0, 0) 70%);
          pointer-events: none;
          z-index: 1;
        }

        .outro-wrap {
          position: relative;
          z-index: 5;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          width: 100%;
          max-width: 960px;
          gap: 36px;
        }

        .outro-logo-box {
          width: 640px;
          height: 260px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .outro-logo-svg {
          width: 100%;
          height: 100%;
          overflow: visible;
        }

        .outro-statement {
          font-size: 68px;
          font-weight: 800;
          line-height: 1.08;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          color: #FFFFFF;
        }

        /* High-contrast CTA pill button */
        .cta-button {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 20px;
          width: 100%;
          max-width: 780px;
          padding: 30px 48px;
          border-radius: 999px;
          background: #F60000;
          color: #FFFFFF;
          font-size: 44px;
          font-weight: 800;
          letter-spacing: 0.04em;
          box-shadow: 0 20px 60px rgba(246, 0, 0, 0.65), 0 0 40px rgba(246, 0, 0, 0.35);
          border: 2px solid rgba(255, 255, 255, 0.25);
        }

        .cta-arrow-circle {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 58px;
          height: 58px;
          border-radius: 50%;
          background: #FFFFFF;
          color: #F60000;
          font-size: 34px;
          font-weight: 800;
        }

        /* Footer Badge */
        .footer-badge {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 16px 36px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.05);
          border: 1.5px solid rgba(255, 255, 255, 0.15);
          color: #E2E8F0;
          font-size: 24px;
          font-weight: 700;
          letter-spacing: 0.06em;
          text-transform: uppercase;
        }

        .trust-chips-row {
          display: flex;
          gap: 16px;
          margin-top: 4px;
        }

        .trust-pill {
          padding: 12px 24px;
          border-radius: 999px;
          background: #101216;
          border: 1px solid rgba(255, 255, 255, 0.12);
          color: #CCCCCC;
          font-size: 20px;
          font-weight: 700;
        }
      </style>

      <div id="root" data-composition-id="scene-7-outro" data-width="1080" data-height="1920">
        <div class="ambient-glow" id="ambient-glow"></div>

        <div class="outro-wrap" id="outro-wrap">
          <!-- Official Dale!TePido Logo Centered at Top -->
          <div class="outro-logo-box" id="outro-logo-box">
            <svg class="outro-logo-svg" viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg">
              <!-- DALE! -->
              <text x="300" y="85" text-anchor="middle" font-family="'Josefin Sans', sans-serif" font-weight="800" font-size="84" fill="#F6F6F6" letter-spacing="8">DALE!</text>
              
              <!-- TEP i D O -->
              <text x="135" y="192" font-family="'Josefin Sans', sans-serif" font-weight="800" font-size="84" fill="#F6F6F6" letter-spacing="8">TEP</text>
              <rect x="278" y="185" width="22" height="7" fill="#F6F6F6" rx="2" />
              <text x="312" y="192" font-family="'Josefin Sans', sans-serif" font-weight="800" font-size="84" fill="#F6F6F6">i</text>
              <circle cx="320" cy="128" r="6.5" fill="#F6F6F6" />
              <text x="354" y="192" font-family="'Josefin Sans', sans-serif" font-weight="800" font-size="84" fill="#F6F6F6" letter-spacing="8">D</text>
              <text x="432" y="192" font-family="'Josefin Sans', sans-serif" font-weight="800" font-size="84" fill="#F6F6F6">O</text>
              
              <!-- Signature Curved Red Hairline Arc from 'i' dot to over 'O' -->
              <path d="M 320 126 C 352 74, 424 74, 460 124" fill="none" stroke="#F60000" stroke-width="4" stroke-linecap="round" />
              <!-- Downward Red Arrowhead -->
              <path d="M 460 134 L 451 119 L 469 119 Z" fill="#F60000" />
            </svg>
          </div>

          <!-- Bold Statement -->
          <h2 class="outro-statement" id="outro-statement">
            TU COMERCIO, TUS REGLAS.
          </h2>

          <!-- High-Contrast CTA Pill Button -->
          <div class="cta-button" id="cta-button">
            <span>daletepido.com.ar</span>
            <div class="cta-arrow-circle">→</div>
          </div>

          <!-- Footer Badge -->
          <div class="footer-badge" id="footer-badge">
            15 DÍAS DE PRUEBA GRATIS · ACTIVÁ TU TIENDA HOY
          </div>

          <!-- Trust Chips -->
          <div class="trust-chips-row" id="trust-chips">
            <div class="trust-pill">0% Comisiones</div>
            <div class="trust-pill">Sin App Obligatoria</div>
            <div class="trust-pill">100% en tu Caja</div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Initial states
        gsap.set("#outro-wrap", { opacity: 1 });
        gsap.set("#outro-logo-box", { scale: 0.8, opacity: 0 });
        gsap.set("#outro-statement", { y: 25, opacity: 0 });
        gsap.set("#cta-button", { scale: 0.82, opacity: 0 });
        gsap.set("#footer-badge", { y: 20, opacity: 0 });
        gsap.set("#trust-chips", { y: 20, opacity: 0 });

        // 0.0s - 0.5s: Logo & Statement
        tl.fromTo("#outro-logo-box",
          { scale: 0.78, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" },
          0.05
        );

        tl.fromTo("#ambient-glow",
          { scale: 0.7, opacity: 0.3 },
          { scale: 1.2, opacity: 0.85, duration: 1.2, ease: "power2.out" },
          0.1
        );

        tl.fromTo("#outro-statement",
          { y: 25, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
          0.25
        );

        // 0.5s: CTA Button Pop-in
        tl.fromTo("#cta-button",
          { scale: 0.8, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.2)" },
          0.45
        );

        // CTA Subtle Pulse
        tl.to("#cta-button", {
          scale: 1.04,
          duration: 0.35,
          repeat: 2,
          yoyo: true,
          ease: "power2.inOut"
        }, 1.0);

        // Footer & Trust chips
        tl.fromTo("#footer-badge",
          { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
          0.7
        );

        tl.fromTo("#trust-chips",
          { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
          0.9
        );

        window.__timelines["scene-7-outro"] = tl;
      </script>
    </template>
  </body>
</html>

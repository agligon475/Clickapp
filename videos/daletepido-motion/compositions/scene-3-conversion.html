      <script>
        const tl = gsap.timeline({ paused: true });

        // Initial States
        gsap.set("#stand-section", { autoAlpha: 1, scale: 1 });
        gsap.set("#acrylic-stand-mockup", { opacity: 0, scale: 0.8, y: 60 });
        gsap.set(".stand-headline", { opacity: 0, y: -30 });
        gsap.set("#outro-section", { autoAlpha: 0, scale: 0.85 });

        // 0.0s - 0.8s: 3D Acrylic Stand pops up
        tl.fromTo(".stand-headline",
          { opacity: 0, y: -30 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.05
        );

        tl.fromTo("#acrylic-stand-mockup",
          { opacity: 0, scale: 0.8, y: 80 },
          { opacity: 1, scale: 1, y: 0, duration: 0.65, ease: "back.out(1.6)" },
          0.15
        );

        tl.fromTo("#ambient-glow",
          { scale: 0.7, opacity: 0.2 },
          { scale: 1.15, opacity: 0.6, duration: 1.0, ease: "power2.out" },
          0.1
        );

        // Subtle float movement
        tl.to("#acrylic-stand-mockup", {
          y: -15,
          duration: 1.0,
          yoyo: true,
          repeat: 1,
          ease: "sine.inOut"
        }, 0.8);

        // 2.25s - 2.5s: Stand dissolves & exits
        tl.to("#stand-section", {
          scale: 0.88,
          autoAlpha: 0,
          duration: 0.22,
          ease: "power2.in"
        }, 2.25);

        // 2.5s - 5.0s: Final Outro Screen Lockup
        tl.fromTo("#outro-section",
          { autoAlpha: 0, scale: 0.85 },
          { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" },
          2.5
        );

        tl.fromTo("#outro-logo-wrap",
          { scale: 0.8, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" },
          2.55
        );

        tl.fromTo("#outro-punchline",
          { y: 30, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
          2.8
        );

        tl.fromTo("#cta-button",
          { scale: 0.82, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.2)" },
          3.0
        );

        // CTA subtle pulse
        tl.to("#cta-button", {
          scale: 1.04,
          duration: 0.4,
          repeat: 2,
          yoyo: true,
          ease: "power2.inOut"
        }, 3.5);

        tl.fromTo("#outro-subtext",
          { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
          3.3
        );

        tl.fromTo("#outro-chips",
          { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
          3.5
        );

        window.__timelines["scene-3-conversion"] = tl;
      </script>

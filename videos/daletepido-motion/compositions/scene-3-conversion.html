      <script>
        const tl = gsap.timeline({ paused: true });

        // Ambient glow subtle movement
        tl.fromTo(
          "#wa-ambient",
          { x: 0, y: -40, scale: 0.9, opacity: 0.5 },
          { x: -30, y: 60, scale: 1.2, opacity: 0.85, duration: 5.0, ease: "none" },
          0
        );

        // Initially hide Final CTA Screen at t=0
        tl.set("#cta-screen", { opacity: 0, scale: 0.9, y: 50 }, 0);

        // WhatsApp Notification slides down from top (0.1s - 0.75s)
        tl.fromTo(
          "#wa-notification",
          { opacity: 0, y: -160, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.65, ease: "power3.out" },
          0.1
        );

        // Floating Badge springs up with pulse glow (0.7s - 1.35s)
        tl.fromTo(
          "#wa-badge",
          { opacity: 0, y: 80, scale: 0.85 },
          { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.7)" },
          0.7
        );

        // Pulse glow on commission badge at 1.4s
        tl.to("#wa-badge", { scale: 1.06, duration: 0.25, ease: "power1.out" }, 1.4);
        tl.to("#wa-badge", { scale: 1.0, duration: 0.25, ease: "power1.in" }, 1.65);

        // WhatsApp card and badge slide up and fade out (2.3s - 2.6s)
        tl.to(
          ["#wa-notification", "#wa-badge"],
          { opacity: 0, y: -60, scale: 0.94, duration: 0.3, ease: "power2.in" },
          2.3
        );

        // Final CTA Screen Enters (2.5s - 3.2s)
        tl.fromTo(
          "#cta-screen",
          { opacity: 0, y: 60, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.4)" },
          2.55
        );

        // CTA Button Pop Attention Spring (2.95s - 3.55s)
        tl.fromTo(
          "#cta-btn",
          { scale: 0.88 },
          { scale: 1.06, duration: 0.3, ease: "back.out(2)" },
          2.95
        );
        tl.to("#cta-btn", { scale: 1.0, duration: 0.25, ease: "power2.out" }, 3.28);

        // Staggered CTA Trust Pills (3.3s - 3.8s)
        tl.fromTo(
          ".cta-mini-pill",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.4, stagger: 0.1, ease: "power2.out" },
          3.3
        );

        // Subtle breathing hold until frame end (5.0s)
        tl.to("#cta-screen", { y: -6, duration: 1.2, ease: "sine.inOut" }, 3.8);

        window.__timelines["scene-conversion"] = tl;
      </script>

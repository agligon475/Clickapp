<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Preguntas Frecuentes — FerreApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

<style>
:root {
  --red:        #D72638;
  --red-dark:   #A81D2A;
  --red-glow:   rgba(215,38,56,.15);
  --black:      #0E0E0E;
  --steel:      #1C1C1E;
  --iron:       #2A2A2D;
  --zinc:       #3E3E42;
  --silver:     #8A8A90;
  --fog:        #C8C8CC;
  --white:      #F5F5F0;
  --font-head:  'Barlow Condensed', sans-serif;
  --font-body:  'Barlow', sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}

body{
  font-family:var(--font-body);
  background:var(--black);
  color:var(--white);
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
}

body::before{
  content:'';
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:.6;
}

/* TOPBAR */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(14,14,14,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--zinc);
  display:flex;align-items:center;
  padding:0 24px;height:60px;gap:16px;
}
.logo{
  font-family:var(--font-head);
  font-size:24px;font-weight:800;
  color:white;letter-spacing:-.01em;
  display:flex;align-items:center;gap:8px;
  text-decoration:none;
}
.logo-icon{
  width:32px;height:32px;background:var(--red);
  border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:16px;
  box-shadow:0 0 12px var(--red-glow);
}
.tagline{
  font-size:11px;color:var(--silver);
  border-left:1px solid var(--zinc);
  padding-left:12px;margin-left:4px;
  display:none;
}
@media(min-width:500px){.tagline{display:block;}}

/* PAGE CONTENT */
.page{
  flex:1;
  max-width:800px;
  margin:0 auto;
  width: 100%;
  padding:40px 20px;
  position:relative;z-index:1;
}

.page-title {
  font-family:var(--font-head);
  font-size:42px;
  font-weight:800;
  text-transform:uppercase;
  margin-bottom:32px;
  color:var(--white);
}

.page-title span {
  color:var(--red);
}

/* FAQ ACCORDION */
.faq-list {
  display:flex;
  flex-direction:column;
  gap:16px;
}

.faq-item {
  background:var(--steel);
  border:1px solid var(--zinc);
  border-radius:10px;
  overflow:hidden;
}

.faq-question {
  width:100%;
  text-align:left;
  background:transparent;
  border:none;
  padding:20px;
  color:var(--white);
  font-family:var(--font-body);
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:background 0.2s;
}

.faq-question:hover {
  background:rgba(255,255,255,0.02);
}

.faq-icon {
  color:var(--red);
  font-size:20px;
  transition:transform 0.3s ease;
}

.faq-item.active .faq-icon {
  transform:rotate(180deg);
}

.faq-answer {
  padding:0 20px;
  max-height:0;
  overflow:hidden;
  transition:all 0.3s ease;
  color:var(--fog);
  line-height:1.6;
}

.faq-item.active .faq-answer {
  padding:0 20px 20px 20px;
  max-height:500px; /* Arbitrary large number for CSS transition */
}

/* FOOTER */
.footer{
  border-top:1px solid var(--zinc);
  background:var(--steel);
  padding:32px 24px;
  text-align:center;
  position:relative;z-index:1;
  margin-top:auto;
}
.footer a{color:var(--red);text-decoration:none;}
.social-icon-btn {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--iron); border: 1px solid var(--zinc);
  color: var(--silver); font-size: 16px;
  transition: all 0.2s ease; text-decoration: none;
}
.social-icon-btn:hover {
  background: var(--red); color: var(--white);
  border-color: var(--red); transform: translateY(-2px);
}


</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="logo">
    <div class="logo-icon"><i class="bi bi-tools"></i></div>
    FerreApp
  </a>
  <span class="tagline">Volver a la tienda</span>
</header>

<main class="page">
  <h1 class="page-title">Preguntas <span>Frecuentes</span></h1>
  
  <div class="faq-list" id="faq-container">
    <p style="color:var(--silver);padding:20px;">Cargando preguntas...</p>
  </div>
</main>

<footer class="footer">
  <div style="margin-bottom:16px;" id="footer-store-name-container">
    <strong id="footer-store-name" style="color:var(--white);font-size:16px;">FerreApp</strong>
    <div id="footer-store-desc" style="font-size:11px;color:var(--silver);margin-top:4px;">Buenos Aires, Argentina</div>
  </div>
  
  <div id="footer-socials" style="display:flex;justify-content:center;gap:16px;margin-bottom:16px;flex-wrap:wrap;">
    <!-- Filled dynamically -->
  </div>
  
  <div style="display:flex;justify-content:center;gap:16px;margin-bottom:16px;flex-wrap:wrap;font-size:12px;">
    <a href="nosotros-test.html" style="color:var(--fog);text-decoration:none;">Nosotros</a>
    <span style="color:var(--zinc);">|</span>
    <a href="faq-test.html" style="color:var(--red);text-decoration:none;">Preguntas Frecuentes</a>
  </div>
  
  <span style="opacity:.5;font-size:12px;">Powered by <a href="#" style="color:var(--silver);">StoreApp</a></span>
</footer>
<script>
const rawSupabaseUrl = localStorage.getItem('storeapp_supabase_url');
const SUPABASE_URL = (rawSupabaseUrl && rawSupabaseUrl.startsWith('http')) ? rawSupabaseUrl : 'https://iaylgsthwildjkiiwgfd.supabase.co';
const SUPABASE_KEY = localStorage.getItem('storeapp_supabase_key') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlheWxnc3Rod2lsZGpraWl3Z2ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyOTQwODksImV4cCI6MjA5Mzg3MDA4OX0.4aysjORaQ_158r9CFgLSkcqmwpHFXsxZ9T18jEMF6z4';

// Obtener store_id dinámicamente desde el subdominio, parámetro de URL o localStorage
const getStoreId = () => {
  const hostname = window.location.hostname.toLowerCase();
  
  if (hostname.endsWith('.daletepido.com.ar') && hostname !== 'daletepido.com.ar' && hostname !== 'www.daletepido.com.ar') {
    return hostname.replace('.daletepido.com.ar', '');
  }
  if (hostname.endsWith('.clickapp.com') && hostname !== 'clickapp.com' && hostname !== 'www.clickapp.com') {
    return hostname.replace('.clickapp.com', '');
  }
  
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get('store') || localStorage.getItem('storeapp_store_id') || 'ferre-now';
};

const STORE_ID = getStoreId();
localStorage.setItem('storeapp_store_id', STORE_ID);

const defaultFaq = [
  { q: '¿Cuáles son los métodos de envío?', a: 'Hacemos envíos a todo el país. Trabajamos con cadetería propia para CABA y GBA entregando en el día para pedidos realizados antes de las 14hs. Para el interior del país despachamos a través de Correo Argentino o la encomienda que prefieras.' },
  { q: '¿Qué medios de pago aceptan?', a: 'Aceptamos transferencias bancarias, Mercado Pago, tarjetas de crédito (hasta 3 cuotas sin interés) y efectivo si retirás por nuestro local. Al finalizar tu pedido por WhatsApp te enviaremos los links de pago.' },
  { q: '¿Puedo retirar mi pedido en persona?', a: 'Sí, podés seleccionar la opción "Retiro en local" al realizar tu pedido. Una vez que te confirmemos que tu pedido está listo, podés pasar a retirarlo de Lunes a Viernes de 9 a 18hs y Sábados de 9 a 13hs.' },
  { q: '¿Los productos tienen garantía?', a: 'Todos nuestros productos cuentan con garantía oficial de fábrica. El plazo depende de la marca y el tipo de herramienta, variando generalmente entre 6 y 24 meses. Conservá tu factura de compra para validarla.' }
];

function toggleFaq(btn) {
  const item = btn.parentElement;
  item.classList.toggle('active');
}

function applyStoredConfig() {
  let cfg = {};
  try { cfg = JSON.parse(localStorage.getItem('storeapp_cfg_' + STORE_ID) || localStorage.getItem('storeapp_cfg') || '{}'); } catch(e) {}

  const accent = cfg.color || '#D72638';
  const theme  = cfg.theme || 'dark';

  const hex2rgb = h => { const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); return `${r},${g},${b}`; };
  const darken  = (h,p=20) => { let r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); const f=1-p/100; return '#'+[r,g,b].map(v=>Math.max(0,Math.round(v*f)).toString(16).padStart(2,'0')).join(''); };

  const themes = {
    dark:  { bg:'#0E0E0E', steel:'#1C1C1E', iron:'#2A2A2D', zinc:'#3E3E42', text:'#F5F5F0', muted:'#8A8A90', fog:'#C8C8CC' },
    light: { bg:'#F5F5F0', steel:'#EBEBEB', iron:'#E0E0E0', zinc:'#CACACA', text:'#0E0E0E', muted:'#6A6A70', fog:'#4A4A50' },
    brand: { bg:accent,   steel:darken(accent,15), iron:darken(accent,25), zinc:darken(accent,35), text:'#fff', muted:'rgba(255,255,255,.7)', fog:'rgba(255,255,255,.9)' },
  };
  const t = themes[theme] || themes.dark;

  const root = document.documentElement.style;
  root.setProperty('--red',       accent);
  root.setProperty('--red-dark',  darken(accent,20));
  root.setProperty('--red-glow',  `rgba(${hex2rgb(accent)},.15)`);
  root.setProperty('--black',     t.bg);
  root.setProperty('--steel',     t.steel);
  root.setProperty('--iron',      t.iron);
  root.setProperty('--zinc',      t.zinc);
  root.setProperty('--white',     t.text);
  root.setProperty('--silver',    t.muted);
  root.setProperty('--fog',       t.fog);

  if (cfg.font) {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = `https://fonts.googleapis.com/css2?family=${cfg.font.replace(/ /g,'+')}:wght@400;600;700;800&display=swap`;
    document.head.appendChild(link);
    root.setProperty('--font-head', `'${cfg.font}', sans-serif`);
  }
  if (cfg.fontBody) root.setProperty('--font-body', `'${cfg.fontBody}', sans-serif`);

  // logoImg priority: cfg.logo (Supabase URL) -> namespaced localStorage -> default localStorage
  const logoImg = cfg.logo || localStorage.getItem(`storeapp_logo_${STORE_ID}`) || localStorage.getItem('storeapp_logo');
  const logoEl  = document.querySelector('.logo');
  if (logoEl) {
    if (logoImg) {
      logoEl.innerHTML = `<img src="${logoImg}" alt="${cfg.name||'Logo'}" style="height:32px;width:32px;object-fit:contain;border-radius:6px;"/> ${cfg.name||'Mi Tienda'}`;
    } else if (cfg.name) {
      logoEl.innerHTML = `<span class="logo-icon">${cfg.emoji||'🏪'}</span>${cfg.name}`;
    }
  }

  if (cfg.name) document.title = cfg.name + ' — Preguntas Frecuentes';

  // Update Footer Details
  const fnContainer = document.getElementById('footer-store-name-container');
  if (fnContainer) {
    const fname = document.getElementById('footer-store-name');
    const fdesc = document.getElementById('footer-store-desc');
    if (fname) fname.textContent = cfg.name || 'Mi Tienda';
    if (fdesc) fdesc.textContent = [cfg.direccion, cfg.horario].filter(Boolean).join(' • ') || '¡Gracias por visitarnos!';
  }

  // Update Social Links
  const fSocials = document.getElementById('footer-socials');
  if (fSocials) {
    fSocials.innerHTML = '';
    let soc = cfg.socials || {};
    if (!soc.ig && !soc.fb && !soc.web && !soc.x && !soc.ml && !soc.tn && !soc.maps) {
      soc = {
        ig: 'instagram.com/tu_cuenta',
        fb: 'facebook.com/tu_pagina',
        web: 'tumarca.com',
        maps: 'maps.google.com'
      };
    }
    const links = [
      { id: 'web', icon: 'bi-globe', title: 'Sitio Web', url: soc.web },
      { id: 'ig', icon: 'bi-instagram', title: 'Instagram', url: soc.ig },
      { id: 'fb', icon: 'bi-facebook', title: 'Facebook', url: soc.fb },
      { id: 'x', icon: 'bi-twitter-x', title: 'X (Twitter)', url: soc.x },
      { id: 'ml', icon: 'bi-shop-window', title: 'MercadoLibre', url: soc.ml },
      { id: 'tn', icon: 'bi-cloud-check', title: 'TiendaNube', url: soc.tn },
      { id: 'maps', icon: 'bi-geo-alt', title: 'Google Maps', url: soc.maps }
    ];
    links.forEach(l => {
      if (l.url) {
        const a = document.createElement('a');
        a.href = l.url.startsWith('http') ? l.url : `https://${l.url}`;
        a.target = '_blank';
        a.className = 'social-icon-btn';
        a.title = l.title;
        a.innerHTML = `<i class="bi ${l.icon}"></i>`;
        fSocials.appendChild(a);
      }
    });
  }

  document.querySelectorAll('a').forEach(a => {
    const href = a.getAttribute('href');
    if (href && (href.startsWith('index.html') || href === '/' || href.startsWith('tienda-test.html') || href.startsWith('nosotros-test.html') || href.startsWith('faq-test.html') || href.startsWith('tienda-demo.html'))) {
      try {
        const url = new URL(href, window.location.href);
        url.searchParams.set('store', STORE_ID);
        a.href = url.pathname + url.search + url.hash;
      } catch(e) {
        // Fallback for relative paths without domain if URL parsing fails
        const separator = href.includes('?') ? '&' : '?';
        a.href = href.split('#')[0] + separator + 'store=' + encodeURIComponent(STORE_ID) + (href.includes('#') ? '#' + href.split('#')[1] : '');
      }
    }
  });
}

async function loadFaqFromSupabase() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/company_settings?store_id=eq.${encodeURIComponent(STORE_ID)}`, {
      cache: 'no-cache',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    if (res.ok) {
      const data = await res.json();
      if (data && data.length > 0) {
        const dbCfg = data[0];
        
        let parsedDesign = {};
        try {
          if (dbCfg.email) parsedDesign = JSON.parse(dbCfg.email);
        } catch(e) {}

        const remoteStoreCfg = {
          name: dbCfg.business_name || '',
          tagline: dbCfg.tagline || '',
          color: dbCfg.primary_color || '',
          logo: dbCfg.logo_url || '',
          theme: parsedDesign.theme || 'dark',
          font: parsedDesign.font || '',
          fontBody: parsedDesign.fontBody || '',
          emoji: parsedDesign.emoji || '🏪',
          direccion: dbCfg.direccion || '',
          horario: dbCfg.horario || '',
          socials: dbCfg.phone ? JSON.parse(dbCfg.phone) : {}
        };
        
        localStorage.setItem('storeapp_cfg', JSON.stringify(remoteStoreCfg));
        localStorage.setItem('storeapp_cfg_' + STORE_ID, JSON.stringify(remoteStoreCfg));
        
        applyStoredConfig();

        let faqList = parsedDesign.faq || [];
        if (faqList.length === 0) {
          const localPages = JSON.parse(localStorage.getItem(`storeapp_pages_${STORE_ID}`) || localStorage.getItem('storeapp_pages') || '{}');
          faqList = localPages.faq || defaultFaq;
        }

        renderFaqList(faqList);
        return;
      }
    }
  } catch(e) {
    console.error("Error loading FAQ from Supabase", e);
  }

  // Fallback
  renderLocalFaq();
}

function renderFaqList(faqList) {
  const container = document.getElementById('faq-container');
  if (!container) return;

  try {
    container.innerHTML = faqList.map(item => `
      <div class="faq-item">
        <button class="faq-question" onclick="toggleFaq(this)">
          ${item.q.replace(/</g, '&lt;')}
          <i class="bi bi-chevron-down faq-icon"></i>
        </button>
        <div class="faq-answer">
          ${item.a.replace(/</g, '&lt;').replace(/\n/g, '<br/>')}
        </div>
      </div>
    `).join('');
  } catch(e) {
    container.innerHTML = '<p style="color:var(--red);padding:20px;">Error al procesar las preguntas.</p>';
  }
}

function renderLocalFaq() {
  try {
    const dataStr = localStorage.getItem(`storeapp_pages_${STORE_ID}`) || localStorage.getItem('storeapp_pages');
    let faqList = defaultFaq;
    
    if (dataStr) {
      const data = JSON.parse(dataStr);
      if (data.faq && data.faq.length > 0) {
        faqList = data.faq;
      }
    }
    
    renderFaqList(faqList);
  } catch(e) {
    document.getElementById('faq-container').innerHTML = '<p style="color:var(--red);padding:20px;">Error al cargar las preguntas.</p>';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  applyStoredConfig();
  loadFaqFromSupabase();
});
</script>

</body>
</html>

name: Build Android APK (Dale! Te Pido)

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar directorio Android y manifiesto TWA
        run: |
          mkdir -p android-project
          cp twa-manifest.json android-project/twa-manifest.json

      - name: Preparar keystore de firma
        run: |
          keytool -genkeypair -v -keystore android-project/android.keystore \
            -alias daletepido -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "daletepido2026pass" -keypass "daletepido2026pass" \
            -dname "CN=DaleTePido, OU=Mobile, O=DaleTePido, L=Buenos Aires, S=Buenos Aires, C=AR"

      - name: Compilar APK Android con contenedor oficial de Google Bubblewrap
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/android-project:/app \
            -w /app \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD=daletepido2026pass \
            -e BUBBLEWRAP_KEY_PASSWORD=daletepido2026pass \
            ghcr.io/googlechromelabs/bubblewrap:latest build --skipPwaValidation

      - name: Subir APK generado como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: DaleTePido-Android-APK
          path: |
            android-project/*.apk
            android-project/*.aab
            android-project/app/build/outputs/apk/**/*.apk
          retention-days: 30

name: Build Android APK (Dale! Te Pido)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle CLI
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Configurar Android SDK local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Preparar keystore de firma
        run: |
          rm -f android/android.keystore
          keytool -genkeypair -v -keystore android/android.keystore -alias daletepido -keyalg RSA -keysize 2048 -validity 10000 -storepass daletepido2026pass -keypass daletepido2026pass -dname "CN=DaleTePido, OU=Mobile, O=DaleTePido, L=Buenos Aires, S=Buenos Aires, C=AR" -noprompt || true
          ls -la android/

      - name: Compilar APK con Gradle
        id: gradle_step
        working-directory: android
        run: |
          set -o pipefail
          echo "=== LISTANDO TAREAS DISPONIBLES ==="
          gradle tasks --all | grep -E "assemble" || true
          echo "=== COMPILANDO :app:assembleRelease Y :app:assembleDebug ==="
          gradle :app:assembleRelease :app:assembleDebug --no-daemon 2>&1 | tee gradle-build.log

      - name: Publicar Diagnóstico en Job Summary
        if: always()
        run: |
          if [ -f android/gradle-build.log ]; then
            echo "### 📋 Salida Completa de Gradle" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat android/gradle-build.log | head -n 80 >> $GITHUB_STEP_SUMMARY
            echo '---' >> $GITHUB_STEP_SUMMARY
            cat android/gradle-build.log | tail -n 80 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Localizar y preparar APK generado
        run: |
          mkdir -p dist-apk
          echo "=== BUSCANDO ARCHIVOS APK EN EL REPOSITORIO ==="
          find . -name "*.apk"
          find . -name "*.apk" -exec cp {} dist-apk/ \;
          for f in dist-apk/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" dist-apk/DaleTePido.apk
            break
          done
          echo "=== ARCHIVOS EN DIST-APK ==="
          ls -la dist-apk/
          if [ -z "$(ls -A dist-apk/*.apk 2>/dev/null)" ]; then
            echo "ERROR: No se encontró ningún archivo APK generado en el repositorio"
            exit 1
          fi

      - name: Subir APK generado como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: DaleTePido-Android-APK
          path: dist-apk/*.apk
          retention-days: 30

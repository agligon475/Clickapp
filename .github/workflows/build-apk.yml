name: Build Android APK (Dale! Te Pido)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle CLI
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Configurar Android SDK local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Compilar APK con Gradle
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon

      - name: Localizar y preparar APK generado
        run: |
          mkdir -p dist-apk
          echo "=== BUSCANDO ARCHIVOS APK EN EL REPOSITORIO ==="
          find . -name "*.apk"
          find . -name "*.apk" -exec cp {} dist-apk/DaleTePido.apk \;
          echo "=== ARCHIVOS EN DIST-APK ==="
          ls -la dist-apk/
          if [ ! -f dist-apk/DaleTePido.apk ]; then
            echo "ERROR: No se encontró ningún archivo APK generado"
            exit 1
          fi

      - name: Subir APK generado como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: DaleTePido-Android-APK
          path: dist-apk/*.apk
          retention-days: 30

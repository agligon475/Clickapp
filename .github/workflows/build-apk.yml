name: Build Android APK (Dale! Te Pido)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versión de la App (ej: 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Código de versión (ej: 1)'
        required: true
        default: '1'

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0

      - name: Configurar entorno Bubblewrap sin preguntas interactivas
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF
          echo "Bubblewrap configurado con Java en $JAVA_HOME y Android SDK en $ANDROID_SDK_ROOT"

      - name: Instalar Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Preparar directorio Android y manifiesto TWA
        run: |
          mkdir -p android-project
          cp twa-manifest.json android-project/twa-manifest.json

      - name: Preparar keystore de firma
        run: |
          keytool -genkeypair -v -keystore android-project/android.keystore \
            -alias daletepido -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "daletepido2026pass" -keypass "daletepido2026pass" \
            -dname "CN=DaleTePido, OU=Mobile, O=DaleTePido, L=Buenos Aires, S=Buenos Aires, C=AR"

      - name: Compilar APK Android (TWA)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: daletepido2026pass
          BUBBLEWRAP_KEY_PASSWORD: daletepido2026pass
        run: |
          cd android-project
          bubblewrap build --skipPwaValidation

      - name: Subir APK generado como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: DaleTePido-Android-APK
          path: |
            android-project/*.apk
            android-project/*.aab
            android-project/app/build/outputs/apk/**/*.apk
          retention-days: 30

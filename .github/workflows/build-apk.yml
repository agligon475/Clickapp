name: Build Android APK (Dale! Te Pido)

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar keystore de firma
        run: |
          keytool -genkeypair -v -keystore android/android.keystore \
            -alias daletepido -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "daletepido2026pass" -keypass "daletepido2026pass" \
            -dname "CN=DaleTePido, OU=Mobile, O=DaleTePido, L=Buenos Aires, S=Buenos Aires, C=AR"

      - name: Compilar APK Release con Gradle
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Subir APK generado como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: DaleTePido-Android-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

name: Build Android APK (Dale! Te Pido)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle CLI
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Aceptar licencias y configurar Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Generar debug keystore estándar para compilación
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compilar APK con Gradle
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Diagnóstico en caso de error
        if: failure()
        run: |
          echo "### ❌ Diagnóstico de Fallo en Gradle" >> $GITHUB_STEP_SUMMARY
          if [ -f android/build.log ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat android/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "=== DETALLE PRINCIPAL DEL ERROR ==="
            grep -A 40 "What went wrong" android/build.log || cat android/build.log
          else
            echo "No se encontró archivo build.log" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Localizar y preparar APK generado
        run: |
          mkdir -p dist-apk
          echo "=== BUSCANDO ARCHIVOS APK EN ANDROID/ ==="
          find android/ -name "*.apk"
          APK_FILE=$(find android/app/build/outputs/apk/ -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/ -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_FILE" ]; then
            echo "Copiando $APK_FILE a dist-apk/DaleTePido.apk"
            cp "$APK_FILE" dist-apk/DaleTePido.apk
          fi
          echo "=== ARCHIVOS EN DIST-APK ==="
          ls -la dist-apk/
          if [ ! -f dist-apk/DaleTePido.apk ]; then
            echo "ERROR: No se encontró ningún archivo APK generado"
            exit 1
          fi

      - name: Subir APK generado como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: DaleTePido-Android-APK
          path: dist-apk/*.apk
          retention-days: 30

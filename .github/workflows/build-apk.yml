name: Build Android APK (Dale! Te Pido)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle CLI
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Configurar Android SDK local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Preparar keystore de firma
        run: |
          rm -f android/android.keystore
          keytool -genkeypair -v -keystore android/android.keystore -alias daletepido -keyalg RSA -keysize 2048 -validity 10000 -storepass daletepido2026pass -keypass daletepido2026pass -dname "CN=DaleTePido, OU=Mobile, O=DaleTePido, L=Buenos Aires, S=Buenos Aires, C=AR" -noprompt || true
          ls -la android/

      - name: Compilar APK con Gradle
        id: gradle_step
        working-directory: android
        run: |
          gradle :app:assembleRelease :app:assembleDebug --no-daemon 2>&1 | tee gradle-build.log

      - name: Publicar Diagnóstico en Job Summary
        if: always()
        run: |
          if [ -f android/gradle-build.log ]; then
            echo "### 📋 Resumen Gradle" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -A 25 "What went wrong" android/gradle-build.log || tail -n 60 android/gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Localizar y preparar APK generado
        run: |
          mkdir -p dist-apk
          echo "=== Contenido de outputs ==="
          find android/app/build/outputs/ -type f || true
          echo "=== Copiando archivos APK ==="
          find android/ -name "*.apk" -exec cp {} dist-apk/ \;
          for f in dist-apk/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" dist-apk/DaleTePido.apk
            break
          done
          echo "=== Archivos en dist-apk ==="
          ls -la dist-apk/
          if [ -z "$(ls -A dist-apk/*.apk 2>/dev/null)" ]; then
            echo "ERROR: No se encontró ningún archivo APK generado en android/"
            exit 1
          fi

      - name: Subir APK generado como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: DaleTePido-Android-APK
          path: dist-apk/*.apk
          retention-days: 30
